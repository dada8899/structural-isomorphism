# arXiv submission metadata — C4 reject-aware pipeline preprint v0.4
# Companion to C1 v0.4 (release/arxiv/c1-unified-preprint-v0.4/)
# Date: 2026-05-25 (SESSION-25)

title: "A reject-aware pipeline for cross-domain universality discovery"

authors:
  - name: "Wan Qinghui (万庆徽)"
    affiliation: "Independent researcher, Structural Isomorphism Project"
    orcid: ""  # populate if/when ORCID is linked
    email: ""  # leave empty; arXiv form takes contact email separately

abstract_file: abstract.txt   # 1900 chars, under arXiv 1920 limit
                              # main.tex carries the full long abstract verbatim

# arXiv classification
primary_category: cs.LG
cross_lists:
  - stat.ME           # statistical methodology (verdict aggregation, plurality consensus)
  - cond-mat.stat-mech  # universality classes, SOC framing
  - physics.data-an   # the data-analysis pipeline framing
  - q-bio.QM          # cross-domain biological applications (neural avalanches)

msc_classification:
  - "62-07"   # Data analysis
  - "68T50"   # Natural language processing (LLM critic methodology)
  - "82C99"   # Time-dependent statistical mechanics (universality)

# Companion bundle members
companion_preprints:
  - id: c1-unified-preprint-v0.4
    relation: "Empirical companion. This preprint references it as [13] for the 13-system + 4-null + A2 empirical validation downstream of the reject-aware pipeline."
    location: "release/arxiv/c1-unified-preprint-v0.4/"
  - id: methodology-short-note
    relation: "Sibling. The 3 v0.5 methodology patterns ((s*, k) reparam, multilayer test, head-aware validator) are documented in a separate short note pre-registered alongside this submission."
