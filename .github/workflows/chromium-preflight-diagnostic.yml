name: Chromium preflight diagnostic only

on:
  push:
    branches: [codex/structure-chromium-preflight-diagnostic-20261023-attempt2]

permissions:
  contents: read

jobs:
  diagnostic-only:
    if: >-
      github.event_name == 'push'
      && github.repository == 'dada8899/structural-isomorphism'
      && github.ref == 'refs/heads/codex/structure-chromium-preflight-diagnostic-20261023-attempt2'
      && github.event.created == true
      && toJSON(github.event.deleted) == 'false'
      && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
          submodules: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/prepare_ci_chromium.py
            scripts/verify_ci_chromium_setup.py
            scripts/diagnose_ci_chromium_preflight.py
            .github/workflows/chromium-preflight-diagnostic.yml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare only the original ten SDK pins
        run: |
          python -m pip install \
            pytest==9.0.3 \
            playwright==1.59.0 \
            pytest-playwright==0.7.2 \
            fastapi==0.135.0 \
            pydantic==2.7.4 \
            starlette==1.3.1 \
            'uvicorn[standard]==0.27.1' \
            PyJWT==2.15.1 \
            slowapi==0.1.9 \
            structlog==25.5.0
      - name: Observe frozen readonly preflight predicates only
        id: diagnostic
        run: python -I -B scripts/diagnose_ci_chromium_preflight.py
      - name: Upload only safe diagnostic metadata
        if: ${{ always() && steps.diagnostic.outputs.diagnostic_safe == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: chromium-preflight-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/structure-chromium-preflight-diagnostic-${{ github.run_id }}-1/preflight-diagnostic.json
          if-no-files-found: error
          include-hidden-files: false
