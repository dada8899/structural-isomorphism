name: Native Linux lifecycle probe

on:
  push:
    branches: [codex/structure-native-linux-lifecycle-attempt6-20261024]

permissions:
  contents: read

concurrency:
  group: native-lifecycle-one-run
  cancel-in-progress: false

jobs:
  probe:
    if: >-
      github.event_name == 'push'
      && github.repository == 'dada8899/structural-isomorphism'
      && github.ref == 'refs/heads/codex/structure-native-linux-lifecycle-attempt6-20261024'
      && github.run_attempt == '1'
      && github.event.created == true
      && toJSON(github.event.deleted) == 'false'
      && github.event.before == '0000000000000000000000000000000000000000'
      && github.event.after == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      PROBE_PUSH_CREATED: ${{ toJSON(github.event.created) }}
      PROBE_PUSH_DELETED: ${{ toJSON(github.event.deleted) }}
      PROBE_PUSH_BEFORE: ${{ github.event.before }}
      PROBE_PUSH_AFTER: ${{ github.event.after }}
    steps:
      - name: Start the single finite clock before checkout or SDK setup
        timeout-minutes: 1
        run: |
          /usr/bin/python3 -I -B - <<'PY'
          import json, os, re, time
          from pathlib import Path
          if os.environ['RUNNER_ENVIRONMENT'] != 'github-hosted' or os.environ['GITHUB_RUN_ATTEMPT'] != '1':
              raise SystemExit('PROBE_REFUSED')
          head = os.environ['GITHUB_SHA']
          if not re.fullmatch('[0-9a-f]{40}', head) or head != os.environ['PROBE_PUSH_AFTER'] or os.environ['GITHUB_EVENT_NAME'] != 'push' or os.environ['PROBE_PUSH_CREATED'] != 'true' or os.environ['PROBE_PUSH_DELETED'] != 'false' or os.environ['PROBE_PUSH_BEFORE'] != '0' * 40:
              raise SystemExit('PROBE_REFUSED')
          now = time.monotonic()
          marker = {'protocol': 'native-lifecycle-clock-v1', 'head': head,
                    'run_id': os.environ['GITHUB_RUN_ID'], 'attempt': '1',
                    'started': now, 'deadline': now + 300}
          path = Path(os.environ['RUNNER_TEMP']) / 'native-lifecycle-clock.json'
          fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
          try:
              os.fchmod(fd, 0o600)
              os.write(fd, json.dumps(marker, separators=(',', ':'), allow_nan=False).encode())
          finally:
              os.close(fd)
          PY
      - uses: actions/checkout@v4
        timeout-minutes: 1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          lfs: false
          submodules: false
      - uses: actions/setup-python@v5
        timeout-minutes: 1
        with:
          python-version: '3.11'
      - name: Prepare original ten pins and two proven import dependencies
        timeout-minutes: 2
        run: |
          python -I -B scripts/probe-native-linux-lifecycle.py budget
          timeout 75s python -m pip --isolated install --disable-pip-version-check --no-cache-dir \
            --index-url https://pypi.org/simple \
            pytest==9.0.3 playwright==1.59.0 pytest-playwright==0.7.2 \
            fastapi==0.135.0 pydantic==2.7.4 starlette==1.3.1 \
            'uvicorn[standard]==0.27.1' PyJWT==2.15.1 slowapi==0.1.9 structlog==25.5.0 \
            httpx==0.27.2 numpy==1.26.3
          python -I -B scripts/probe-native-linux-lifecycle.py budget
      - name: Run the fixed controller once with no inherited credentials
        timeout-minutes: 5
        run: |
          probe_python="$(python -I -B -c 'import sys; from pathlib import Path; print(Path(sys.executable).resolve())')"
          sudo --non-interactive /usr/bin/env -i \
            PATH=/usr/sbin:/usr/bin:/sbin:/bin LANG=C.UTF-8 \
            RUNNER_TEMP="$RUNNER_TEMP" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_REF="$GITHUB_REF" GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            PROBE_PUSH_CREATED="$PROBE_PUSH_CREATED" PROBE_PUSH_DELETED="$PROBE_PUSH_DELETED" \
            PROBE_PUSH_BEFORE="$PROBE_PUSH_BEFORE" PROBE_PUSH_AFTER="$PROBE_PUSH_AFTER" \
            "$probe_python" -I -B "$GITHUB_WORKSPACE/scripts/probe-native-linux-lifecycle.py" run
      - name: Validate the only public artifact before upload
        id: receipt
        if: always()
        timeout-minutes: 1
        run: |
          python -I -B - <<'PY'
          import importlib.util, os, stat
          from pathlib import Path
          source = Path('scripts/probe-native-linux-lifecycle.py').resolve()
          spec = importlib.util.spec_from_file_location('receipt_reader', source)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          path = Path(os.environ['RUNNER_TEMP']) / 'native-lifecycle-receipt.json'
          fd = os.open(path, os.O_RDONLY | os.O_NOFOLLOW | os.O_CLOEXEC)
          try:
              before = os.fstat(fd)
              if not stat.S_ISREG(before.st_mode) or stat.S_IMODE(before.st_mode) != 0o600 or before.st_uid != os.getuid() or before.st_nlink != 1:
                  raise SystemExit('PUBLIC_RECEIPT_REFUSED')
              value = module.strict_json(os.read(fd, 32769))
              module.validate_receipt(value)
              if value['head'] != os.environ['GITHUB_SHA'] or module.stat_key(os.fstat(fd)) != module.stat_key(before) or module.stat_key(path.lstat()) != module.stat_key(before):
                  raise SystemExit('PUBLIC_RECEIPT_REFUSED')
          finally:
              os.close(fd)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('verified=true\n')
          PY
      - name: Upload only the validated bounded public receipt
        if: always() && steps.receipt.outputs.verified == 'true'
        timeout-minutes: 1
        uses: actions/upload-artifact@v4
        with:
          name: native-lifecycle-public-receipt
          path: ${{ runner.temp }}/native-lifecycle-receipt.json
          if-no-files-found: error
          retention-days: 3
