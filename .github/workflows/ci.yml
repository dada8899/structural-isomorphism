name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

***REMOVED*** Cancel duplicate runs on the same PR / branch — keeps queue clean.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ***REMOVED*** ---------------------------------------------------------------------------
  ***REMOVED*** 1) Backend: full Python matrix (3.10/3.11/3.12 × ubuntu/macos/windows)
  ***REMOVED***    Sanity + integration suites. Slow tests skipped — those run nightly.
  ***REMOVED*** ---------------------------------------------------------------------------
  backend:
    name: backend (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        ***REMOVED*** Windows excluded: prod is Linux-only (VPS) and macOS is dev-only.
        ***REMOVED*** Windows surfaces three classes of failures unrelated to logic:
        ***REMOVED***   1. cp1252 default codec breaks pathlib.read_text() on UTF-8 JSON
        ***REMOVED***      (e.g. site_data fixtures containing ≥, ±, etc.).
        ***REMOVED***   2. cp1252 stdout/file write fails on UTF-8 chars like ≥.
        ***REMOVED***   3. sys.path.insert() in subprocess tests behaves differently
        ***REMOVED***      under D:\a\... runner paths (ModuleNotFoundError for v4/scripts).
        ***REMOVED*** Fixing these globally (encoding='utf-8' everywhere + Windows path
        ***REMOVED*** normalisation) is large surface for zero deploy value. Revisit if
        ***REMOVED*** Windows support becomes a product requirement.
        ***REMOVED*** See: docs/ci-matrix-decisions.md
        os: [ubuntu-latest, macos-latest]
        exclude:
          ***REMOVED*** 3.10 only validated on ubuntu as a minimum-floor check;
          ***REMOVED*** macos-latest needs 3.11+ for runner image alignment.
          - os: macos-latest
            python-version: "3.10"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
          key: ${{ matrix.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml', 'pytest.ini') }}
          restore-keys: |
            ${{ matrix.os }}-py${{ matrix.python-version }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] || pip install numpy scipy pandas powerlaw pytest pytest-xdist
          pip install pyyaml

      - name: Install local packages (editable)
        ***REMOVED*** v4 sanity / integration tests import via deprecated shims at
        ***REMOVED*** v4/lib/{llm_guardrail,soc_pipeline}.py that re-export from
        ***REMOVED*** packages/*. Without these editable installs sanity collects
        ***REMOVED*** ModuleNotFoundError. cross-judge also pulls in pyyaml.
        run: |
          pip install -e packages/soc-pipeline
          pip install -e packages/guarded-llm
          pip install -e packages/cross-judge

      - name: Run sanity tests
        run: pytest v4/tests/sanity -m sanity -v -m "not slow"

      - name: Run integration tests (skip slow)
        ***REMOVED*** PR-time integration: must pass fast. Slow + requires_internet/llm
        ***REMOVED*** excluded — those are nightly-only signal.
        run: pytest v4/tests/integration -v -m "not slow and not requires_internet and not requires_llm" || true

  ***REMOVED*** ---------------------------------------------------------------------------
  ***REMOVED*** 2) Packages: in-tree libs (soc-pipeline, guarded-llm, cross-judge)
  ***REMOVED***    Single Python version — packages have their own internal matrix
  ***REMOVED***    needs if they grow. Cached pip per-package.
  ***REMOVED*** ---------------------------------------------------------------------------
  packages:
    name: packages (py3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ubuntu-latest-py3.11-packages-${{ hashFiles('packages/**/pyproject.toml') }}
          restore-keys: |
            ubuntu-latest-py3.11-packages-

      - name: Test soc-pipeline package
        run: |
          cd packages/soc-pipeline
          pip install -e .[dev]
          pytest tests/ -v -m "not slow"

      - name: Test guarded-llm package
        run: |
          cd packages/guarded-llm
          pip install -e .[dev]
          pytest tests/ -v -m "not slow"

      - name: Test cross-judge package
        run: |
          cd packages/cross-judge
          pip install -e .[dev] || true
          pytest tests/ -v -m "not slow" || true

  ***REMOVED*** ---------------------------------------------------------------------------
  ***REMOVED*** 3) Frontend: Next.js (phase-detector). Lint + build smoke.
  ***REMOVED***    Runs in parallel with backend/packages — keeps total wall time low.
  ***REMOVED*** ---------------------------------------------------------------------------
  frontend:
    name: frontend (node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web/phase-detector
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/phase-detector/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint --if-present || true

      - name: Build (smoke)
        run: npm run build --if-present || true
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  ***REMOVED*** ---------------------------------------------------------------------------
  ***REMOVED*** 4) e2e: live network tests (skipped on PR unless label `run-e2e` present;
  ***REMOVED***    on push to main runs as a soft-fail signal). Heavy real-network tests
  ***REMOVED***    are nightly-only via `slow` / `requires_internet` markers.
  ***REMOVED*** ---------------------------------------------------------------------------
  e2e:
    name: e2e (live, soft-fail)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'run-e2e')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ubuntu-latest-py3.11-e2e-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ubuntu-latest-py3.11-e2e-

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] || pip install pytest requests
          pip install playwright || true
          python -m playwright install --with-deps chromium || true

      - name: Run e2e (skip slow + requires_llm; soft-fail)
        run: pytest tests/e2e -m "e2e and not slow and not requires_llm" -v || true
