name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, integration/structure-rebuild-v1, bootstrap/structure-ci-20261016]
  pull_request:
    branches: [main, integration/structure-rebuild-v1]

# Cancel duplicate runs on the same PR / branch — keeps queue clean.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Canonical retrieval benchmark contract. This is deliberately offline and
  # dependency-light: schema, generator determinism, and OOS policy must fail
  # the PR rather than becoming a soft signal.
  retrieval-eval-contract:
    name: retrieval eval contract (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install pytest PyYAML==6.0.3
      - name: Validate retrieval evaluation contract
        run: make PY=python test-retrieval-contract

      - name: Validate product and research contracts
        run: >-
          python -m pytest
          tests/test_public_controls.py
          tests/test_english_review_tool.py
          tests/test_research_claim_gate.py
          -q

  site-docs-contract:
    name: project site document closure (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify every project-site document is published and navigable
        run: python -I scripts/check_site_docs.py

  phase-python-contract:
    name: Phase Python contract (complete, offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact Phase runtime and test dependencies
        run: >-
          python -m pip install
          -r v4/product/d1_phase_detector/api/requirements.txt
          pytest==9.0.3
          httpx==0.27.2
      - name: Run both complete Phase Python test trees
        run: make PY=python test-phase-python-contract

  browser-product-contract:
    name: browser product contract (local, fail-closed)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser test dependencies
        run: |
          python -m pip install \
            pytest==9.0.3 \
            playwright==1.59.0 \
            pytest-playwright==0.7.2 \
            fastapi==0.135.0 \
            pydantic==2.7.4 \
            starlette==1.3.1 \
            'uvicorn[standard]==0.27.1' \
            PyJWT==2.15.1 \
            slowapi==0.1.9 \
            structlog==25.5.0
          python -m playwright install --with-deps chromium
      - name: Install complete backend runtime and verify imports
        run: |
          set -euo pipefail
          BROWSER_BACKEND_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          "$BROWSER_BACKEND_PYTHON" -m pip install uv==0.11.8
          test "$(uv --version | cut -d ' ' -f 2)" = "0.11.8"
          uv pip install --python "$BROWSER_BACKEND_PYTHON" --system --torch-backend cpu -r web/backend/requirements.txt
          uv pip check --python "$BROWSER_BACKEND_PYTHON" --system
          "$BROWSER_BACKEND_PYTHON" - <<'PY'
          import importlib.metadata
          import json
          import os
          from pathlib import Path
          import re
          import sys
          import tempfile
          from packaging.specifiers import SpecifierSet

          if sys.version_info[:2] != (3, 11):
              raise SystemExit("browser backend runtime requires Python 3.11")
          root = Path.cwd().resolve()
          versions = {}
          for raw in (root / "web/backend/requirements.txt").read_text().splitlines():
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.fullmatch(r"([A-Za-z0-9_.-]+)(?:\[[A-Za-z0-9_,.-]+\])?==([^\s#]+)", line)
              if match is None:
                  raise SystemExit("backend runtime requirements must remain exactly pinned")
              name, expected = match.groups()
              actual = importlib.metadata.version(name)
              if not SpecifierSet("==" + expected).contains(actual, prereleases=True):
                  raise SystemExit("browser backend runtime differs from its requirements")
              versions[name] = actual
          with tempfile.TemporaryDirectory(prefix="structural-browser-import-", dir=os.environ["RUNNER_TEMP"]) as directory:
              private = Path(directory)
              for name in ("auth", "reports", "sso", "cache", "hf", "tmp"):
                  (private / name).mkdir()
              os.environ.update({
                  "STRUCTURAL_ENV": "test", "AUTH_ENABLED": "false",
                  "AUTH_DATA_DIR": str(private / "auth"),
                  "STRUCTURAL_SSO_DATA_DIR": str(private / "sso"),
                  "REPORT_DATA_DIR": str(private / "reports"),
                  "REPORT_DB_PATH": str(private / "reports/history.sqlite3"),
                  "STRUCTURAL_DATA_DIR": str(private),
                  "STRUCTURAL_FAVORITES_PATH": str(private / "favorites.jsonl"),
                  "STRUCTURAL_LOG_FILE": str(private / "application.jsonl"),
                  "XDG_CACHE_HOME": str(private / "cache"), "HF_HOME": str(private / "hf"),
                  "TMPDIR": str(private / "tmp"), "HF_HUB_OFFLINE": "1",
                  "TRANSFORMERS_OFFLINE": "1", "DO_NOT_TRACK": "1",
              })
              sys.path[:0] = [str(root / "web/backend"), str(root)]
              import main
              import torch
              if Path(main.__file__).resolve() != root / "web/backend/main.py":
                  raise SystemExit("browser backend import escaped the current checkout")
              if torch.version.cuda is not None:
                  raise SystemExit("browser backend smoke requires CPU-only Torch")
              print(json.dumps({"event": "browser.backend_import_ok", "versions": versions,
                                "main": str(Path(main.__file__).resolve().relative_to(root)),
                                "torch_cuda": torch.version.cuda}, sort_keys=True))
          PY
      - name: Verify financial CSV readonly preview UI
        run: make PY=python test-financial-preview-browser-contract
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: web/phase-detector/pnpm-lock.yaml
      - name: Install Phase dependencies
        working-directory: web/phase-detector
        run: pnpm install --frozen-lockfile
      - name: Verify the current public research entry journey
        run: >-
          pytest
          tests/e2e/test_full_public_surface.py::test_public_entry_actual_owner_index_anchor
          tests/e2e/test_full_public_surface.py::test_public_entry_default_retirement_and_language
          tests/e2e/test_full_public_surface.py::test_public_entry_no_script_native_forms_never_send_private_get
          tests/e2e/test_full_public_surface.py::test_public_entry_real_login_return_owner_and_legacy_resource_links
          tests/e2e/test_full_public_surface.py::test_public_entry_main_cta_first_login_returns_to_research
          -m "e2e and not requires_internet" -v
      - name: Verify real Next auth, failure states, mobile controls and axe
        run: pytest web/tests/e2e/test_phase_auth_real.py -v
      - name: Verify consent-gated official analytics transport
        run: pytest web/tests/e2e/test_cookie_consent.py -v

  browser-beta-surface-contract:
    name: browser beta surfaces (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: search-ask-analyze-phenomenon
            pytest_args: >-
              tests/e2e/test_search_private_navigation.py
              tests/e2e/test_phenomenon_evidence_mobile.py
            pytest_args_isolated: ''
            node_tests: >-
              web/frontend/tests/test_privateNavigation.js
              web/frontend/tests/test_searchBootstrap.js
              web/frontend/tests/test_searchSynthesisRendering.js
              web/frontend/tests/test_askTrust.js
              web/frontend/tests/test_analyzeTrust.js
              web/frontend/tests/test_buildAnalyzeUrl.js
          - shard: discovery-classes-papers
            pytest_args: >-
              tests/e2e/test_discovery_validation_plan.py
              tests/e2e/test_classes_language_mobile.py
              tests/e2e/test_papers_public_runtime.py
            pytest_args_isolated: ''
            node_tests: ''
          - shard: library-auth-reports-favorites
            pytest_args: >-
              tests/e2e/test_full_public_surface.py
              tests/e2e/test_unified_research_library.py
              tests/e2e/test_history_sidebar.py
            pytest_args_isolated: >-
              web/tests/e2e/test_thank_you_copy.py
              web/tests/e2e/test_report_share.py
              web/tests/e2e/test_cross_domain_report_claim.py
              web/tests/e2e/test_subscriptions_closed.py
              web/tests/e2e/test_newsletter_e2e.py
            node_tests: >-
              web/frontend/tests/test_analyticsSensitiveRoutes.js
              web/frontend/tests/test_historyPrivacy.js
              web/frontend/tests/test_reportTrust.js
              web/frontend/tests/test_historySidebarPerformance.js
              web/frontend/tests/test_newsletterClosed.js
          - shard: secondary-whitespace
            pytest_args: >-
              web/tests/e2e/test_secondary_tools_candidate_journeys.py
              web/tests/e2e/test_whitespace.py
            pytest_args_isolated: ''
            node_tests: >-
              web/frontend/tests/test_secondaryToolContracts.js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install locked axe asset
        working-directory: web/phase-detector
        run: pnpm install --frozen-lockfile
      - name: Install browser contract dependencies
        run: |
          python -m pip install \
            pytest==9.0.3 \
            playwright==1.59.0 \
            pytest-playwright==0.7.2 \
            httpx==0.27.2 \
            fastapi==0.135.0 \
            pydantic==2.7.4 \
            starlette==1.3.1 \
            'uvicorn[standard]==0.27.1' \
            PyJWT==2.15.1 \
            slowapi==0.1.9 \
            structlog==25.5.0
          python -m playwright install --with-deps chromium
      - name: Install complete backend runtime and verify imports
        if: matrix.shard == 'library-auth-reports-favorites'
        run: |
          set -euo pipefail
          BROWSER_BACKEND_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          "$BROWSER_BACKEND_PYTHON" -m pip install uv==0.11.8
          test "$(uv --version | cut -d ' ' -f 2)" = "0.11.8"
          uv pip install --python "$BROWSER_BACKEND_PYTHON" --system --torch-backend cpu -r web/backend/requirements.txt
          uv pip check --python "$BROWSER_BACKEND_PYTHON" --system
          "$BROWSER_BACKEND_PYTHON" - <<'PY'
          import importlib.metadata
          import json
          import os
          from pathlib import Path
          import re
          import sys
          import tempfile
          from packaging.specifiers import SpecifierSet

          if sys.version_info[:2] != (3, 11):
              raise SystemExit("browser backend runtime requires Python 3.11")
          root = Path.cwd().resolve()
          versions = {}
          for raw in (root / "web/backend/requirements.txt").read_text().splitlines():
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              match = re.fullmatch(r"([A-Za-z0-9_.-]+)(?:\[[A-Za-z0-9_,.-]+\])?==([^\s#]+)", line)
              if match is None:
                  raise SystemExit("backend runtime requirements must remain exactly pinned")
              name, expected = match.groups()
              actual = importlib.metadata.version(name)
              if not SpecifierSet("==" + expected).contains(actual, prereleases=True):
                  raise SystemExit("browser backend runtime differs from its requirements")
              versions[name] = actual
          with tempfile.TemporaryDirectory(prefix="structural-browser-import-", dir=os.environ["RUNNER_TEMP"]) as directory:
              private = Path(directory)
              for name in ("auth", "reports", "sso", "cache", "hf", "tmp"):
                  (private / name).mkdir()
              os.environ.update({
                  "STRUCTURAL_ENV": "test", "AUTH_ENABLED": "false",
                  "AUTH_DATA_DIR": str(private / "auth"),
                  "STRUCTURAL_SSO_DATA_DIR": str(private / "sso"),
                  "REPORT_DATA_DIR": str(private / "reports"),
                  "REPORT_DB_PATH": str(private / "reports/history.sqlite3"),
                  "STRUCTURAL_DATA_DIR": str(private),
                  "STRUCTURAL_FAVORITES_PATH": str(private / "favorites.jsonl"),
                  "STRUCTURAL_LOG_FILE": str(private / "application.jsonl"),
                  "XDG_CACHE_HOME": str(private / "cache"), "HF_HOME": str(private / "hf"),
                  "TMPDIR": str(private / "tmp"), "HF_HUB_OFFLINE": "1",
                  "TRANSFORMERS_OFFLINE": "1", "DO_NOT_TRACK": "1",
              })
              sys.path[:0] = [str(root / "web/backend"), str(root)]
              import main
              import torch
              if Path(main.__file__).resolve() != root / "web/backend/main.py":
                  raise SystemExit("browser backend import escaped the current checkout")
              if torch.version.cuda is not None:
                  raise SystemExit("browser backend smoke requires CPU-only Torch")
              print(json.dumps({"event": "browser.backend_import_ok", "versions": versions,
                                "main": str(Path(main.__file__).resolve().relative_to(root)),
                                "torch_cuda": torch.version.cuda}, sort_keys=True))
          PY
      - name: Resolve browser child interpreter
        id: browser_child_python
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import sys

          executable = sys.executable
          if not Path(executable).is_absolute() or "\n" in executable or "\r" in executable:
              raise SystemExit("browser child interpreter must be one absolute executable path")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("executable=" + executable + "\n")
          PY
      - name: Run browser surface shard
        run: >-
          pytest ${{ matrix.pytest_args }}
          -m "e2e and not requires_internet" -v
      - name: Run isolated browser surface subgroup
        if: matrix.pytest_args_isolated != ''
        env:
          STRUCTURAL_RELEASE_TEST_PYTHON: ${{ steps.browser_child_python.outputs.executable }}
        run: >-
          pytest ${{ matrix.pytest_args_isolated }}
          -m "e2e and not requires_internet" -v
      - name: Run JavaScript trust contracts
        if: matrix.node_tests != ''
        shell: bash
        run: |
          set -euo pipefail
          for test_file in ${{ matrix.node_tests }}; do
            node "$test_file"
          done

  # ---------------------------------------------------------------------------
  # 1) Backend: full Python matrix (3.10/3.11/3.12 × ubuntu/macos/windows)
  #    Sanity + integration suites. Slow tests skipped — those run nightly.
  # ---------------------------------------------------------------------------
  backend:
    name: backend (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        # Windows excluded: prod is Linux-only (VPS) and macOS is dev-only.
        # Windows surfaces three classes of failures unrelated to logic:
        #   1. cp1252 default codec breaks pathlib.read_text() on UTF-8 JSON
        #      (e.g. site_data fixtures containing ≥, ±, etc.).
        #   2. cp1252 stdout/file write fails on UTF-8 chars like ≥.
        #   3. sys.path.insert() in subprocess tests behaves differently
        #      under D:\a\... runner paths (ModuleNotFoundError for v4/scripts).
        # Fixing these globally (encoding='utf-8' everywhere + Windows path
        # normalisation) is large surface for zero deploy value. Revisit if
        # Windows support becomes a product requirement.
        # See: docs/ci-matrix-decisions.md
        os: [ubuntu-latest, macos-latest]
        exclude:
          # 3.10 only validated on ubuntu as a minimum-floor check;
          # macos-latest needs 3.11+ for runner image alignment.
          - os: macos-latest
            python-version: "3.10"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true   # SESSION-28 N8: matches sanity.yml fix (SESSION-27 §4.2).
                      # `pytest v4/tests/sanity` below loads kb_*.npy embedding
                      # bridges that are LFS-tracked; without this checkout
                      # leaves LFS pointer stubs and np.load raises
                      # UnpicklingError on all 12 embedding-bridge tests.
                      # The other 3 jobs (packages / frontend / e2e) don't read
                      # any LFS-tracked path, so they intentionally skip LFS to
                      # save runner time.

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
          key: ${{ matrix.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml', 'pytest.ini') }}
          restore-keys: |
            ${{ matrix.os }}-py${{ matrix.python-version }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pyyaml

      - name: Install local packages (editable)
        # v4 sanity / integration tests import via deprecated shims at
        # v4/lib/{llm_guardrail,soc_pipeline}.py that re-export from
        # packages/*. Without these editable installs sanity collects
        # ModuleNotFoundError. cross-judge also pulls in pyyaml.
        run: |
          pip install -e packages/soc-pipeline
          pip install -e packages/guarded-llm
          pip install -e packages/cross-judge

      - name: Run sanity tests
        run: pytest v4/tests/sanity -m sanity -v -m "not slow"

      - name: Run integration tests (skip slow)
        # PR-time integration: must pass fast. Slow + requires_internet/llm
        # excluded — those are nightly-only signal.
        run: pytest v4/tests/integration -v -m "not slow and not requires_internet and not requires_llm"

  # ---------------------------------------------------------------------------
  # 2) Packages: all in-tree libraries.
  #    Single Python version — packages have their own internal matrix
  #    needs if they grow. Cached pip per-package.
  # ---------------------------------------------------------------------------
  packages:
    name: packages (py3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ubuntu-latest-py3.11-packages-${{ hashFiles('packages/**/pyproject.toml') }}
          restore-keys: |
            ubuntu-latest-py3.11-packages-

      - name: Test soc-pipeline package
        run: |
          cd packages/soc-pipeline
          pip install -e .[dev]
          pytest tests/ -v -m "not slow"

      - name: Test guarded-llm package
        run: |
          cd packages/guarded-llm
          pip install -e .[dev]
          pytest tests/ -v -m "not slow"

      - name: Test cross-judge package
        run: |
          cd packages/cross-judge
          pip install -e .[dev]
          pytest tests/ -v -m "not slow"

      - name: Test reject-aware-critic package
        run: |
          cd packages/reject-aware-critic
          pip install -e .[dev]
          pytest tests/ -v -m "not slow"

  # ---------------------------------------------------------------------------
  # 3) Frontend: Next.js (phase-detector). Lint + build smoke.
  #    Runs in parallel with backend/packages — keeps total wall time low.
  # ---------------------------------------------------------------------------
  frontend:
    name: frontend (node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web/phase-detector
    steps:
      - uses: actions/checkout@v4

      # phase-detector is a pnpm project — only pnpm-lock.yaml is committed
      # (no package-lock.json). `cache: npm` pointed setup-node at a
      # non-existent package-lock.json and failed at the cache step with
      # "Some specified paths were not resolved". Match storybook.yml /
      # docs.yml: pnpm install + pnpm-lock.yaml cache key.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: web/phase-detector/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build (smoke)
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # ---------------------------------------------------------------------------
  # 4) e2e: live network tests (skipped on PR unless label `run-e2e` present;
  #    on push to main runs as a soft-fail signal). Heavy real-network tests
  #    are nightly-only via `slow` / `requires_internet` markers.
  # ---------------------------------------------------------------------------
  e2e:
    name: e2e (live, soft-fail)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 12
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.base_ref == 'main' &&
       contains(github.event.pull_request.labels.*.name, 'run-e2e'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ubuntu-latest-py3.11-e2e-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ubuntu-latest-py3.11-e2e-

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests playwright
          python -m playwright install --with-deps chromium

      - name: Run e2e (skip slow + requires_llm; soft-fail)
        run: pytest tests/e2e -m "e2e and not slow and not requires_llm" -v

  release-gate-summary:
    name: release-gate
    if: always()
    needs:
      - retrieval-eval-contract
      - site-docs-contract
      - phase-python-contract
      - browser-product-contract
      - browser-beta-surface-contract
      - backend
      - packages
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require every CI dependency to succeed
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              Path(".github/release-gate-manifest.json").read_text(encoding="utf-8")
          )
          expected = set(manifest["ci_aggregator"]["needs"])
          results = json.loads(os.environ["REQUIRED_RESULTS"])
          if set(results) != expected:
              raise SystemExit(f"release-gate dependency drift: {sorted(results)}")
          failed = {
              name: result.get("result")
              for name, result in results.items()
              if result.get("result") != "success"
          }
          if failed:
              raise SystemExit(f"release-gate dependency failure: {failed}")
          print("all CI-internal release dependencies succeeded")
          PY
