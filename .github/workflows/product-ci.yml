name: Product contracts

permissions:
  contents: read

on:
  push:
    branches: [main, integration/structure-rebuild-v1, bootstrap/structure-ci-20261016]
  pull_request:
    branches: [main, integration/structure-rebuild-v1]

concurrency:
  group: product-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product:
    name: product
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Record and verify actual checkout identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          checkout = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if checkout != os.environ["EVENT_SHA"]:
              raise SystemExit("checkout SHA does not match this event")
          print(json.dumps({
              "event": os.environ["EVENT_NAME"],
              "workflow_ref": os.environ["WORKFLOW_REF"],
              "workflow_sha": os.environ["WORKFLOW_SHA"],
              "run_id": os.environ["RUN_ID"],
              "run_attempt": os.environ["RUN_ATTEMPT"],
              "event_sha": os.environ["EVENT_SHA"],
              "checkout_sha": checkout,
              "pr_head_sha": os.environ["PR_HEAD_SHA"],
              "pr_base_sha": os.environ["PR_BASE_SHA"],
          }, sort_keys=True))
          PY
      - name: Install pinned B0 contract dependencies
        run: python -m pip install pytest==9.0.3 PyYAML==6.0.3
      - name: Verify integration gates and production rejection paths
        run: python -m pytest tests/test_integration_ci_contract.py -q
