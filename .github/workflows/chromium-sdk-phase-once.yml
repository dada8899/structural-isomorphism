name: Chromium SDK phase metadata once

on:
  push:
    branches: [codex/structure-chromium-sdk-phase-20261110-once]

permissions:
  contents: read

jobs:
  sdk-phase-once:
    if: >-
      github.event_name == 'push'
      && github.repository == 'dada8899/structural-isomorphism'
      && github.ref == 'refs/heads/codex/structure-chromium-sdk-phase-20261110-once'
      && github.event.created == true
      && toJSON(github.event.deleted) == 'false'
      && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
          submodules: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/prepare_ci_chromium.py
            .github/workflows/chromium-sdk-phase-once.yml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the original ten SDK pins only
        run: |
          python -m pip install \
            pytest==9.0.3 \
            playwright==1.59.0 \
            pytest-playwright==0.7.2 \
            fastapi==0.135.0 \
            pydantic==2.7.4 \
            starlette==1.3.1 \
            'uvicorn[standard]==0.27.1' \
            PyJWT==2.15.1 \
            slowapi==0.1.9 \
            structlog==25.5.0
      - name: One original SDK install with finite failure metadata
        run: python -I -B scripts/prepare_ci_chromium.py
