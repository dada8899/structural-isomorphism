name: Nightly (full suite)

# Runs daily 02:00 UTC (10:00 Beijing). Full suite incl. slow + e2e + load
# smoke (1 VU sanity). Posts a summary to a tracking GitHub issue on failure.
#
# Manual dispatch supported for ad-hoc runs (e.g. before a release tag).
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  # ---------------------------------------------------------------------------
  # 1) Full backend matrix — same axes as CI but WITH slow tests included.
  # ---------------------------------------------------------------------------
  backend-full:
    name: backend full (py${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        os: [ubuntu-latest, macos-latest]
        exclude:
          - os: macos-latest
            python-version: "3.10"
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
          key: ${{ matrix.os }}-py${{ matrix.python-version }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml', 'pytest.ini') }}
          restore-keys: |
            ${{ matrix.os }}-py${{ matrix.python-version }}-pip-

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install \
            -e packages/soc-pipeline \
            -e packages/guarded-llm \
            -e packages/cross-judge \
            -e packages/reject-aware-critic

      - name: Run sanity + integration (incl. slow)
        run: pytest v4/tests -v -m "not requires_llm"

  soc-pipeline-full:
    name: soc-pipeline full (slow + warning budget)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/soc-pipeline/pyproject.toml
      - name: Install soc-pipeline
        run: python -m pip install -e "packages/soc-pipeline[dev]"
      - name: Run complete package suite
        working-directory: packages/soc-pipeline
        run: python -m pytest -ra -q

  # ---------------------------------------------------------------------------
  # 2) Full e2e (live network, all flavors).
  # ---------------------------------------------------------------------------
  e2e-full:
    name: e2e full
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: web/phase-detector/pnpm-lock.yaml

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ubuntu-latest-py3.11-e2e-nightly-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pytest==9.0.3 \
            playwright==1.59.0 \
            pytest-playwright==0.7.2 \
            httpx==0.27.2 \
            fastapi==0.115.14 \
            pydantic==2.6.1 \
            starlette==0.46.2 \
            'uvicorn[standard]==0.27.1' \
            PyJWT==2.12.1 \
            slowapi==0.1.9 \
            structlog==25.5.0 \
            Pillow==12.3.0
          python -m playwright install --with-deps chromium

      - name: Install Phase browser runtime
        working-directory: web/phase-detector
        run: pnpm install --frozen-lockfile

      - name: Require the installed Next and axe runtimes
        working-directory: web/phase-detector
        run: |
          test -x node_modules/.bin/next
          test -s node_modules/axe-core/axe.min.js

      - name: Run e2e (all markers except requires_llm w/o key)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then
            pytest tests/e2e -v -m "e2e"
            pytest web/tests/e2e -v
          else
            pytest tests/e2e -v -m "e2e and not requires_llm"
            pytest web/tests/e2e -v -m "not requires_llm"
          fi

  # ---------------------------------------------------------------------------
  # 3) Load smoke (k6, 1 VU sanity). Prod-safe budget.
  # ---------------------------------------------------------------------------
  load-smoke-1vu:
    name: load smoke (k6, 1 VU)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: structural-production-beta-load
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
          k6 version

      - name: Inspect scripts (parse-check)
        run: |
          set -euo pipefail
          for f in \
            tests/load/phases_smoke.js \
            tests/load/ask_smoke.js \
            tests/load/universality_smoke.js \
            tests/load/mixed_realistic.js \
            tests/load/stress_ramp.js; do
            test -f "$f"
            echo "--- inspect: $f ---"
            k6 inspect "$f" || { echo "PARSE FAIL: $f"; exit 1; }
          done

      - name: Run 1-VU smoke against beta
        env:
          BASE_URL: https://beta.structural.bytedance.city
        run: |
          set -euo pipefail
          mkdir -p tests/load/results
          test -f tests/load/phases_smoke.js
          BASE_URL="$BASE_URL" k6 run --vus 1 --duration 20s tests/load/phases_smoke.js

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-k6-results
          path: tests/load/results/
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 4) Summary — post failure summary to tracking issue.
  # ---------------------------------------------------------------------------
  summary:
    name: post nightly summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [backend-full, soc-pipeline-full, e2e-full, load-smoke-1vu]
    steps:
      - name: Compose status
        id: status
        run: |
          {
            echo "be=${{ needs.backend-full.result }}"
            echo "soc=${{ needs.soc-pipeline-full.result }}"
            echo "e2e=${{ needs.e2e-full.result }}"
            echo "load=${{ needs.load-smoke-1vu.result }}"
          } >> "$GITHUB_OUTPUT"

      - name: Post issue comment (non-success only)
        if: needs.backend-full.result != 'success' || needs.soc-pipeline-full.result != 'success' || needs.e2e-full.result != 'success' || needs.load-smoke-1vu.result != 'success'
        uses: actions/github-script@v8
        with:
          script: |
            const title = "Nightly CI tracker";
            const body = [
              `Nightly run **${context.runId}** finished with non-success results.`,
              "",
              `- backend-full: \`${{ steps.status.outputs.be }}\``,
              `- soc-pipeline-full: \`${{ steps.status.outputs.soc }}\``,
              `- e2e-full: \`${{ steps.status.outputs.e2e }}\``,
              `- load-smoke-1vu: \`${{ steps.status.outputs.load }}\``,
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "cc @dada8899"
            ].join("\n");

            // Find or create the tracker issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "nightly-ci",
              per_page: 5,
            });
            let issue = issues.data.find(i => i.title === title);
            if (!issue) {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: "Auto-managed by `.github/workflows/nightly.yml`. Comments below = recent failures.",
                labels: ["nightly-ci"],
              });
              issue = created.data;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body,
            });
