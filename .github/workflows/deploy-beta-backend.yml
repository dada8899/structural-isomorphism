name: Deploy Beta Backend

# Auto-deploy beta.structural.bytedance.city (FastAPI + static frontend) on
# push to main. Replaces the manual flow:
#   ssh vps; cd structural-isomorphism-v4; git pull; bash scripts/deploy-vps.sh
#
# Path filter scopes deploys to web app + deploy scripts only — pure docs /
# v4 lib / phase-detector changes do not trigger this workflow (phase-detector
# has its own deploy workflow).
#
# Secrets used (same pattern as deploy-phase-detector.yml):
#   VPS_DEPLOY_KEY  — SSH private key authorized on VPS
#   VPS_HOST        — VPS hostname / IP
#   VPS_USER        — SSH user (typically root)

on:
  push:
    branches: [main]
    paths:
      - 'web/backend/**'
      - 'web/frontend/**'
      # Backend imports the in-repo package directly (including model.py and
      # discovery_evidence.py); any behavior change there must redeploy beta.
      - 'structural_isomorphism/**'
      - 'web/scripts/structural-web.service'
      - 'scripts/deploy-vps.sh'
      - 'scripts/deploy-versioned-runtime.sh'
      - 'scripts/deploy-retired-module.sh'
      - 'scripts/deploy-beta-backend.sh'
      - 'scripts/deploy-dispatcher.sh'
      - 'scripts/install-deploy-dispatcher.sh'
      - 'scripts/install-nginx-privacy-vhost.sh'
      - 'web/scripts/beta-structural.nginx.conf'
      - '.github/workflows/deploy-beta-backend.yml'
  workflow_dispatch: {}

# Keep one pending beta release while the host flock serializes cross-product deploys.
concurrency:
  group: deploy-beta-backend
  cancel-in-progress: false
  queue: single

jobs:
  release-contracts:
    name: Python 3.11 exact-SHA release contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Verify checkout identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install exact-SHA contract dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r web/backend/requirements.txt
          python -m pip install pytest
      - name: Verify runtime, privacy, version, and production-smoke contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/web/backend
        run: |
          python -I scripts/check_python_syntax.py
          python -m pytest -q \
            tests/test_deploy_versioned_runtime.py \
            tests/test_nginx_privacy_contract.py \
            tests/test_production_smoke.py
          python -m pytest -q \
            web/backend/tests/test_version.py \
            web/backend/tests/test_privacy_identifiers.py \
            web/backend/tests/test_auth.py \
            web/backend/tests/test_account_data.py \
            web/backend/tests/test_waitlist.py \
            web/backend/tests/test_error_log.py \
            web/backend/tests/test_privacy.py

  deploy:
    needs: release-contracts
    runs-on: ubuntu-latest
    # Covers the 45-minute host-lock wait plus a cold immutable runtime build.
    # Warm deploys reuse the attested release.
    timeout-minutes: 90
    steps:
      - name: Checkout (context only)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull + deploy via deploy-dispatcher (beta-backend route)
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The deploy key is `command="/root/scripts/deploy-dispatcher.sh"`
          # restricted (SESSION-15 incident: pre-2026-05-20 it was forced to
          # `deploy-phase-detector.sh`, which is why backend deploys 5 days
          # of silent failure). The dispatcher routes by SSH_ORIGINAL_COMMAND
          # — send an immutable full SHA. The forced dispatcher accepts only
          # `beta-backend <40 lowercase hex>`, verifies it is reachable from
          # origin/main, and passes the same SHA as DEPLOY_COMMIT.
          ssh -i ~/.ssh/id_deploy \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              "$USER@$HOST" "beta-backend $DEPLOY_SHA"

      - name: Verify prod health (post-commit public verification)
        run: |
          set -euo pipefail
          sleep 5
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" 'https://beta.structural.bytedance.city/api/health?deep=1' || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "[verify] prod healthy (attempt $i)"
              break
            fi
            echo "[verify] retry $i, got $CODE"
            sleep 5
            if [ "$i" = "5" ]; then
              echo "[verify] FAIL: deep health did not return 200 after 5 retries"
              exit 1
            fi
          done

      - name: Verify beta account runtime is enabled (post-commit public verification)
        run: |
          set -euo pipefail
          STATUS=$(curl -sS --max-time 10 -o /tmp/beta-auth-me.json -w '%{http_code}' \
            https://beta.structural.bytedance.city/api/auth/me)
          test "$STATUS" = "401"
          python3 -c 'import json; assert json.load(open("/tmp/beta-auth-me.json"))["error"] == "no session"'

      - name: Verify immutable runtime attestation (post-commit public verification)
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          REQUIREMENTS_SHA=$(python3 - <<'PY'
          import hashlib
          from pathlib import Path
          print(hashlib.sha256(Path("web/backend/requirements.txt").read_bytes()).hexdigest())
          PY
          )
          ATTESTATION=$(curl -fsS --max-time 10 -H 'Cache-Control: no-cache' \
            "https://beta.structural.bytedance.city/assets/runtime-attestation.json?sha=$EXPECTED_SHA")
          VERSION=$(curl -fsS --max-time 10 \
            "https://beta.structural.bytedance.city/api/version?sha=$EXPECTED_SHA")
          EXPECTED_SHA="$EXPECTED_SHA" REQUIREMENTS_SHA="$REQUIREMENTS_SHA" \
            ATTESTATION="$ATTESTATION" VERSION="$VERSION" python3 - <<'PY'
          import hashlib
          import json
          import os
          import re

          body = json.loads(os.environ["ATTESTATION"])
          version = json.loads(os.environ["VERSION"])
          expected_sha = os.environ["EXPECTED_SHA"]
          requirements_sha = os.environ["REQUIREMENTS_SHA"]
          expected_versions = {
              "fastapi": "0.115.14",
              "pydantic": "2.6.1",
              "starlette": "0.46.2",
              "uvicorn": "0.27.1",
          }
          assert body.get("schema_version") == 2, body
          assert body.get("requirements_sha256") == requirements_sha, body
          resolved_graph_sha = body.get("resolved_graph_sha256", "")
          content_sha = body.get("runtime_content_sha256", "")
          freeze_sha = body.get("installed_freeze_sha256", "")
          for digest in (resolved_graph_sha, content_sha, freeze_sha):
              assert isinstance(digest, str) and re.fullmatch(r"[0-9a-f]{64}", digest), body
          composite_payload = (
              f"resolved_graph_sha256={resolved_graph_sha}\n"
              f"runtime_content_sha256={content_sha}\n"
          ).encode("ascii")
          assert hashlib.sha256(composite_payload).hexdigest() == freeze_sha, body
          assert body.get("runtime_id") == f"cpython-311-{requirements_sha}-{freeze_sha}", body
          assert body.get("python_abi") == "cpython-311", body
          assert str(body.get("python_version", "")).startswith("3.11."), body
          assert body.get("git_sha") == expected_sha, body
          for package, expected in expected_versions.items():
              assert body.get(package) == expected, body
          for field in (
              "python_abi", "runtime_id", "requirements_sha256", "installed_freeze_sha256",
              "fastapi", "pydantic", "starlette", "uvicorn", "python_version",
              "git_sha", "deployed_at",
          ):
              assert version.get(field) == body.get(field), (field, version, body)
          PY

      - name: Verify artifact identity and semantic search (post-commit public verification)
        run: |
          set -euo pipefail
          HEALTH=$(curl -fsS --max-time 15 'https://beta.structural.bytedance.city/api/health?deep=1')
          HEALTH="$HEALTH" python3 - <<'PY'
          import json, os
          body = json.loads(os.environ["HEALTH"])
          assert body["status"] == "ok", body
          assert body["kb_size"] == 4443, body
          assert body["artifact_id"] == "structural-v2-kb4443-20260711", body
          assert body["embedding_shape"] == [4443, 768], body
          PY

          queries=(
            '月活用户每月固定流失百分之七，应该如何干预？'
            '为什么有些谣言会突然爆发并形成级联传播？'
            '团队氛围崩溃后为什么很难恢复？'
            '银行挤兑为什么会出现自我强化？'
            '一个平台如何避免正反馈导致系统失控？'
          )
          cross_domain=0
          for query in "${queries[@]}"; do
            BODY=$(curl -fsS --max-time 20 \
              -H 'Content-Type: application/json' \
              --data "$(python3 -c 'import json,sys; print(json.dumps({"query":sys.argv[1],"top_k":5,"rewrite":False,"lang":"zh"}, ensure_ascii=False))' "$query")" \
              https://beta.structural.bytedance.city/api/search)
            RESULT=$(BODY="$BODY" python3 - <<'PY'
          import json, os
          body = json.loads(os.environ["BODY"])
          assert body.get("count", 0) > 0, body
          print(1 if body.get("stats", {}).get("cross_domain_count", 0) > 0 else 0)
          PY
            )
            if [ "$RESULT" = "1" ]; then cross_domain=1; fi
          done
          test "$cross_domain" = "1"

      - name: Verify deploy fingerprint matches the just-deployed commit (post-commit public verification)
        # Session #16: close the SESSION-15-INCIDENT gap.
        # /api/version returns git_sha + model, written into .env.runtime
        # by scripts/deploy-vps.sh. If they don't match what we just pushed,
        # the deploy didn't actually take — fail loudly.
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          EXPECTED_MODEL=$(sed -n 's/^ASK_LLM_MODEL=//p' web/backend/.env.example | head -1)
          if [ -z "$EXPECTED_MODEL" ]; then
            echo "[verify] FAIL: ASK_LLM_MODEL missing from web/backend/.env.example" >&2
            exit 1
          fi

          BODY=$(curl -s --max-time 10 https://beta.structural.bytedance.city/api/version)
          echo "[verify] /api/version response: $BODY"

          # Use python (preinstalled on the runner) instead of jq to keep
          # the workflow free of an extra apt install.
          python3 - <<PY
          import json, sys
          body = json.loads('''$BODY''')
          expected_sha = "$EXPECTED_SHA"
          expected_model = "$EXPECTED_MODEL"
          got_sha = body.get("git_sha", "")
          got_model = body.get("model", "")
          fails = []
          if got_sha != expected_sha:
              fails.append(f"git_sha mismatch: got {got_sha!r}, expected exact {expected_sha!r}")
          if got_model != expected_model:
              fails.append(f"model mismatch: got {got_model!r}, expected {expected_model!r}")
          if fails:
              for f in fails:
                  print(f"[verify] FAIL: {f}", file=sys.stderr)
              sys.exit(1)
          print("[verify] fingerprint OK — prod runs the just-deployed commit + expected model")
          PY
