name: Deploy Beta Backend

# Auto-deploy beta.structural.bytedance.city (FastAPI + static frontend) on
# push to main. Replaces the manual flow:
#   ssh vps; cd structural-isomorphism-v4; git pull; bash scripts/deploy-vps.sh
#
# Path filter scopes deploys to web app + deploy scripts only — pure docs /
# v4 lib / phase-detector changes do not trigger this workflow (phase-detector
# has its own deploy workflow).
#
# Secrets used (same pattern as deploy-phase-detector.yml):
#   VPS_DEPLOY_KEY  — SSH private key authorized on VPS
#   VPS_HOST        — VPS hostname / IP
#   VPS_USER        — SSH user (typically root)

on:
  push:
    branches: [main]
    paths:
      - 'web/backend/**'
      - 'web/frontend/**'
      - 'scripts/deploy-vps.sh'
      - 'scripts/restore-models.sh'
      - '.github/workflows/deploy-beta-backend.yml'
  workflow_dispatch: {}

# Serialize deploys so two pushes do not race on the VPS rsync + restart.
concurrency:
  group: deploy-beta-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (context only)
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull + deploy via deploy-dispatcher (beta-backend route)
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          # The deploy key is `command="/root/scripts/deploy-dispatcher.sh"`
          # restricted (SESSION-15 incident: pre-2026-05-20 it was forced to
          # `deploy-phase-detector.sh`, which is why backend deploys 5 days
          # of silent failure). The dispatcher routes by SSH_ORIGINAL_COMMAND
          # — send "beta-backend" to trigger /root/scripts/deploy-beta-backend.sh
          # which `git reset --hard origin/main` then runs scripts/deploy-vps.sh.
          ssh -i ~/.ssh/id_deploy \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              "$USER@$HOST" "beta-backend"

      - name: Verify prod health
        run: |
          set -euo pipefail
          sleep 5
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" 'https://beta.structural.bytedance.city/api/health?deep=1' || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "[verify] prod healthy (attempt $i)"
              break
            fi
            echo "[verify] retry $i, got $CODE"
            sleep 5
            if [ "$i" = "5" ]; then
              echo "[verify] FAIL: deep health did not return 200 after 5 retries"
              exit 1
            fi
          done

      - name: Verify artifact identity and semantic search
        run: |
          set -euo pipefail
          HEALTH=$(curl -fsS --max-time 15 'https://beta.structural.bytedance.city/api/health?deep=1')
          HEALTH="$HEALTH" python3 - <<'PY'
          import json, os
          body = json.loads(os.environ["HEALTH"])
          assert body["status"] == "ok", body
          assert body["kb_size"] == 4443, body
          assert body["artifact_id"] == "structural-v2-kb4443-20260711", body
          assert body["embedding_shape"] == [4443, 768], body
          PY

          queries=(
            '月活用户每月固定流失百分之七，应该如何干预？'
            '为什么有些谣言会突然爆发并形成级联传播？'
            '团队氛围崩溃后为什么很难恢复？'
            '银行挤兑为什么会出现自我强化？'
            '一个平台如何避免正反馈导致系统失控？'
          )
          cross_domain=0
          for query in "${queries[@]}"; do
            BODY=$(curl -fsS --max-time 20 \
              -H 'Content-Type: application/json' \
              --data "$(python3 -c 'import json,sys; print(json.dumps({"query":sys.argv[1],"top_k":5}, ensure_ascii=False))' "$query")" \
              https://beta.structural.bytedance.city/api/search)
            RESULT=$(BODY="$BODY" python3 - <<'PY'
          import json, os
          body = json.loads(os.environ["BODY"])
          assert body.get("count", 0) > 0, body
          print(1 if body.get("stats", {}).get("cross_domain_count", 0) > 0 else 0)
          PY
            )
            if [ "$RESULT" = "1" ]; then cross_domain=1; fi
          done
          test "$cross_domain" = "1"

      - name: Verify deploy fingerprint matches the just-deployed commit
        # Session #16: close the SESSION-15-INCIDENT gap.
        # /api/version returns git_sha + model, written into .env.runtime
        # by scripts/deploy-vps.sh. If they don't match what we just pushed,
        # the deploy didn't actually take — fail loudly.
        run: |
          set -euo pipefail
          EXPECTED_SHA=$(git rev-parse --short=7 HEAD)
          EXPECTED_MODEL="${EXPECTED_MODEL:-deepseek/deepseek-chat:nitro}"

          BODY=$(curl -s --max-time 10 https://beta.structural.bytedance.city/api/version)
          echo "[verify] /api/version response: $BODY"

          # Use python (preinstalled on the runner) instead of jq to keep
          # the workflow free of an extra apt install.
          python3 - <<PY
          import json, sys
          body = json.loads('''$BODY''')
          expected_sha = "$EXPECTED_SHA"
          expected_model = "$EXPECTED_MODEL"
          got_sha = body.get("git_sha", "")
          got_model = body.get("model", "")
          fails = []
          if not got_sha.startswith(expected_sha):
              fails.append(f"git_sha mismatch: got {got_sha!r}, expected starts-with {expected_sha!r}")
          if got_model != expected_model:
              fails.append(f"model mismatch: got {got_model!r}, expected {expected_model!r}")
          if fails:
              for f in fails:
                  print(f"[verify] FAIL: {f}", file=sys.stderr)
              sys.exit(1)
          print("[verify] fingerprint OK — prod runs the just-deployed commit + expected model")
          PY
