name: Deploy Phase Detector

# Auto-deploy web/phase-detector to VPS phase.bytedance.city on push to main.
# Triggered by:
#   - Push to main touching the Phase frontend/API or this workflow file.
#   - Manual via workflow_dispatch.
#
# Background: the 2026-05-14 incident — devs forgot to rsync .env.production
# so NEXT_PUBLIC_API_BASE baked to localhost:8000 → "Failed to fetch" in prod.
# PR #85 committed .env.production to repo. The forced-command entrypoint
# delegates to the tracked `scripts/deploy-phase-detector-vps.sh` script.

on:
  push:
    branches: [main]
    paths:
      - 'web/phase-detector/**'
      - 'web/backend/api/auth.py'
      - 'web/backend/api/sso.py'
      - 'web/backend/api/favorites.py'
      - 'web/backend/api/report_account.py'
      - 'web/backend/auth/**'
      - 'web/backend/errors.py'
      - 'web/backend/services/account_data_registry.py'
      - 'web/backend/services/auth_store.py'
      - 'web/backend/services/candidate_origin.py'
      - 'web/backend/services/privacy_identifiers.py'
      - 'web/backend/services/report_store.py'
      - 'web/backend/services/sqlite_utils.py'
      - 'web/backend/services/sso_store.py'
      - 'v4/product/d1_phase_detector/api/**'
      - 'scripts/deploy-phase-detector-vps.sh'
      - 'scripts/deploy-phase-detector-entrypoint.sh'
      - 'scripts/deploy-dispatcher.sh'
      - 'scripts/install-deploy-dispatcher.sh'
      - 'scripts/install-nginx-privacy-vhost.sh'
      - 'tests/test_nginx_privacy_contract.py'
      - 'tests/test_phase_privacy_gate.py'
      - '.github/workflows/deploy-phase-detector.yml'
  workflow_dispatch: {}

# Keep one pending Phase release while the host flock serializes cross-product deploys.
concurrency:
  group: deploy-phase-detector
  cancel-in-progress: false
  queue: single

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Covers the 45-minute host-lock wait plus a full Phase build and smoke test.
    timeout-minutes: 90
    steps:
      - name: Checkout exact deployment source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Verify checkout identity
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"

      - name: Set up Phase API Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: v4/product/d1_phase_detector/api/requirements.txt

      - name: Verify repository Python 3.11 syntax
        run: python -I scripts/check_python_syntax.py

      - name: Validate Phase API and privacy release contracts
        run: |
          set -euo pipefail
          python -m venv /tmp/phase-api-import
          /tmp/phase-api-import/bin/pip install --disable-pip-version-check \
            -r v4/product/d1_phase_detector/api/requirements.txt \
            pytest==9.0.3 httpx==0.27.2
          /tmp/phase-api-import/bin/pip check
          PYTHONPATH=. /tmp/phase-api-import/bin/python -c \
            "from v4.product.d1_phase_detector.api.main import app; from web.backend.api.auth import _account_registry; assert app.title; assert len(_account_registry().manifest()) == 3"
          PYTHONPATH=. /tmp/phase-api-import/bin/python -m pytest -q \
            tests/test_phase_privacy_gate.py \
            tests/test_nginx_privacy_contract.py \
            tests/test_deploy_versioned_runtime.py::test_phase_workflow_installs_exact_test_dependency_closure \
            v4/product/d1_phase_detector/api/tests/test_privacy_middleware.py \
            v4/product/d1_phase_detector/api/tests/test_waitlist.py

      - name: SSH deploy
        env:
          SSH_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # The forced dispatcher accepts only a full main-reachable SHA.
          ssh -i ~/.ssh/id_deploy \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              "$USER@$HOST" "phase-deploy $DEPLOY_SHA"

      - name: Smoke test
        run: |
          set -euo pipefail
          sleep 5
          curl -fsS -o /dev/null https://phase.bytedance.city/
          health="$(curl -fsS https://phase.bytedance.city/api/health)"
          meta="$(curl -fsS https://phase.bytedance.city/api/ews/meta)"
          HEALTH_JSON="$health" META_JSON="$meta" python3 - <<'PY'
          import json
          import os

          health = json.loads(os.environ["HEALTH_JSON"])
          assert health == {"status": "ok"}, health

          meta = json.loads(os.environ["META_JSON"])
          assert isinstance(meta.get("version"), str) and meta["version"], meta
          assert meta.get("n_tickers") == 597, meta
          assert meta.get("price_provenance") == "demo", meta
          PY
          auth_status="$(curl -sS -o /tmp/phase-auth-me.json -w '%{http_code}' https://phase.bytedance.city/api/auth/me)"
          if grep -qx 'NEXT_PUBLIC_AUTH_ENABLED=true' web/phase-detector/.env.production; then
            test "$auth_status" = "401"
            python3 -c 'import json; assert json.load(open("/tmp/phase-auth-me.json"))["error"] == "no session"'
          else
            test "$auth_status" = "503"
            python3 -c 'import json; assert json.load(open("/tmp/phase-auth-me.json"))["error"] == "auth unavailable"'
          fi
          echo "Smoke OK"
