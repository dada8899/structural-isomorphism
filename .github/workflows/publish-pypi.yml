name: Publish to PyPI

# Triggered by pushing a SemVer tag like `v0.1.0`, `v1.2.3`, or `v1.2.3-rc1`.
# Builds + publishes all three packages (soc-pipeline / guarded-llm / cross-judge).
#
# Auth precedence per job:
#   1. PYPI_API_TOKEN secret  (account- or project-scoped token)
#   2. OIDC trusted publisher (no secret — must be configured on PyPI side)
#
# See docs/deployment/PYPI_PUBLISH.md for full setup steps.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If true, build but do not upload (twine check only)"
        required: false
        default: false
        type: boolean

# Avoid duplicate publishes if a tag is force-pushed.
concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # `id-token: write` is required for OIDC trusted publishing path.
  id-token: write

jobs:
  build-and-publish:
    name: build+publish ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Environment is referenced by PyPI OIDC trusted publisher config.
    # Create the env once in repo Settings → Environments → "pypi"
    # (can also gate manual approvals there if desired).
    environment:
      name: pypi
      url: https://pypi.org/p/${{ matrix.package }}

    # Workflow-level env so `if:` expressions can branch on token presence.
    # (Step-level `env:` is not visible to that step's own `if:`.)
    env:
      HAS_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}

    strategy:
      fail-fast: false
      matrix:
        package:
          - soc-pipeline
          - guarded-llm
          - cross-judge

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade build twine

      - name: Build sdist + wheel
        working-directory: packages/${{ matrix.package }}
        run: |
          rm -rf dist/
          python -m build --sdist --wheel --outdir dist/
          ls -la dist/

      - name: Twine check (metadata + README rendering)
        working-directory: packages/${{ matrix.package }}
        run: twine check dist/*

      - name: Upload artifacts (debug + provenance)
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.package }}
          path: packages/${{ matrix.package }}/dist/*
          retention-days: 30

      # ---------- Publish path A: API token (preferred when secret set) ----------
      - name: Publish via API token
        if: >-
          github.event_name == 'push' &&
          env.HAS_PYPI_TOKEN == 'true' &&
          inputs.dry_run != true
        env:
          PACKAGE: ${{ matrix.package }}
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        working-directory: packages/${{ matrix.package }}
        run: |
          echo "Publishing $PACKAGE via API token..."
          twine upload --non-interactive --disable-progress-bar dist/*

      # ---------- Publish path B: OIDC trusted publisher (fallback) -------------
      # Runs only when PYPI_API_TOKEN secret is unset — requires PyPI trusted
      # publisher to be configured per package (see docs/deployment/PYPI_PUBLISH.md).
      - name: Publish via OIDC trusted publisher
        if: >-
          github.event_name == 'push' &&
          env.HAS_PYPI_TOKEN == 'false' &&
          inputs.dry_run != true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/${{ matrix.package }}/dist/
          # skip-existing avoids failure when re-running for a tag where some
          # packages already published.
          skip-existing: true

      - name: Summary
        if: always()
        env:
          PACKAGE: ${{ matrix.package }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          echo "### $PACKAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`$REF_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dry run: \`$DRY_RUN\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${HAS_PYPI_TOKEN}" = "true" ]; then
            echo "- Auth path: API token" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Auth path: OIDC trusted publisher" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- PyPI: https://pypi.org/p/$PACKAGE" >> "$GITHUB_STEP_SUMMARY"
