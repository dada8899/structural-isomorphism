      with:
        node-version: '20'
    - name: Install v4 sanity deps
      run: 'python -m pip install --upgrade pip

        pip install numpy scipy pandas powerlaw matplotlib pytest pydantic pyyaml scikit-learn

        '
    - name: Install local packages (editable + dev extras)
      run: 'pip install -e "packages/soc-pipeline[dev]"

        pip install -e "packages/guarded-llm[dev]"

        pip install -e "packages/cross-judge[dev]"

        pip install -e "packages/reject-aware-critic[dev]"

        '
    - name: Install web/backend deps
      run: 'pip install -r web/backend/requirements.txt

        '
    - name: OpenAPI artifact matches release-target schema runtime
      run: make PY=python openapi-check
    - name: Leg 2 — web/backend pytest baseline
      env:
        PYTHONPATH: ${{ github.workspace }}/web/backend:${{ github.workspace }}
      working-directory: web/backend
      run: '# -ra: surface skipped/xfailed reasons. -q: compact output.

        # --tb=short: brief tracebacks.

        # The baseline as of 2026-05-24 is 781 passing tests; new tests

        # added in 0.1.1+ must also pass here.

        # Stop on a real failure so its traceback survives the job deadline.

        python -m pytest tests/test_formal_main_admission.py -p no:logging -x -ra -q --tb=short --durations=10

        python -m pytest tests/test_formal_main_source_supervisor.py -p no:logging -x -ra -q --tb=short --durations=10

        python -m pytest tests/test_research_financial_import.py -p no:logging -x -ra -q --tb=short --durations=10

        python -m pytest tests/test_formal_model_startup.py -p no:logging -x -ra -q --tb=short --durations=10

        python -m pytest tests/acceptance/test_source_history_fixture_current15.py -p no:logging -x -ra -q --tb=short --durations=10

        python -m pytest tests/test_research_financial_registries.py -p no:logging -x -ra -q --tb=short --durations=10

