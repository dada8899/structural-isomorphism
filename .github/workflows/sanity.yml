name: sanity tests

# Repo-level "sanity" check. This workflow is the one required by main-branch
# protection — it must keep passing on every PR / push to main.
#
# Four complete legs, all required by the `sanity` dependency gate:
#   1. v4 sanity tests (existing, deterministic primitive suite — must stay green).
#   2. Complete web/backend baseline in a separate bounded prerequisite job.
#   3. Every offline root product/research/deployment contract under tests/.
#   4. Per-package unit tests for packages/* (guarded-llm / soc-pipeline /
#      cross-judge / reject-aware-critic).
#
# The deeper matrix (Linux + macOS × py3.10–3.13) for packages/* lives in
# `ci-packages.yml`. This sanity workflow only runs the canonical py3.11 Linux
# leg. The complete backend inventory has a bounded 45-minute CI capacity;
# product and per-test deadlines stay unchanged, and no suite is omitted.

on:
  push:
    branches: [main, integration/structure-rebuild-v1, bootstrap/structure-ci-20261016]
  pull_request:
    branches: [main, integration/structure-rebuild-v1]
  workflow_dispatch:

concurrency:
  group: sanity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sanity-backend:
    name: sanity-backend
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
    - sanity-backend-ordinary-a
    - sanity-backend-ordinary-b
    - sanity-backend-fresh
    if: always()
    steps:
    - name: Require all complete backend groups success
      env:
        BACKEND_ORDINARY_A_RESULT: ${{ needs['sanity-backend-ordinary-a'].result }}
        BACKEND_ORDINARY_B_RESULT: ${{ needs['sanity-backend-ordinary-b'].result }}
        BACKEND_FRESH_RESULT: ${{ needs['sanity-backend-fresh'].result }}
      run: "for result in \"${BACKEND_ORDINARY_A_RESULT:-}\" \"${BACKEND_ORDINARY_B_RESULT:-}\" \"${BACKEND_FRESH_RESULT:-}\"; do\n  if [ \"$result\" != \"success\" ]; then\n    echo \"A complete backend group did not succeed.\"\n    exit 1\n  fi\ndone\n"
  sanity-backend-ordinary-a:
    name: sanity-backend-ordinary-a
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v5
      with:
        lfs: true
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: pip
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install v4 sanity deps
      run: 'python -m pip install --upgrade pip

        pip install numpy scipy pandas powerlaw matplotlib pytest pydantic pyyaml scikit-learn

        '
    - name: Install local packages (editable + dev extras)
      run: 'pip install -e "packages/soc-pipeline[dev]"

        pip install -e "packages/guarded-llm[dev]"

        pip install -e "packages/cross-judge[dev]"

        pip install -e "packages/reject-aware-critic[dev]"

        '
    - name: Install web/backend deps
      run: 'pip install -r web/backend/requirements.txt

        '
    - name: OpenAPI artifact matches release-target schema runtime
      run: make PY=python openapi-check
    - name: Leg 2 — web/backend pytest baseline
      env:
        PYTHONPATH: ${{ github.workspace }}/web/backend:${{ github.workspace }}
      working-directory: web/backend
      run: '# -ra: surface skipped/xfailed reasons. -q: compact output.

        # --tb=short: brief tracebacks.

        # The baseline as of 2026-05-24 is 781 passing tests; new tests

        # added in 0.1.1+ must also pass here.

        # Stop on a real failure so its traceback survives the job deadline.

        python -m pytest tests/acceptance/test_browser_response_capture.py tests/acceptance/test_formal_main_startup_diagnostics.py tests/test_account_data.py tests/test_analyze_persist.py tests/test_api_hardening.py tests/test_app_hardening_launch.py tests/test_artifact_manifest.py tests/test_ask_endpoint.py tests/test_ask_streaming.py tests/test_ask_trust_contract.py tests/test_auth.py tests/test_auth_rate_limit_w11a_coverage.py tests/test_auth_smtp_transport.py tests/test_auth_tier.py tests/test_beta_primary_auth.py tests/test_billing.py tests/test_checkout_mock.py tests/test_checkout_mock_w11a_coverage.py tests/test_connections_api.py tests/test_connections_match_requests.py tests/test_connections_messages.py tests/test_connections_referrals.py tests/test_connections_store.py tests/test_correlation.py tests/test_cost_ledger.py tests/test_deep_report_contract.py tests/test_diagnose.py tests/test_error_log.py tests/test_evidence_method_plan_codec.py tests/test_evidence_method_plan_schemas.py tests/test_favorites.py tests/test_financial_function_batch.py tests/test_flags.py tests/test_flywheel_feedback.py tests/test_formal_search_profile.py tests/test_formal_secret_entry.py tests/test_health_fail_closed.py tests/test_history_db.py tests/test_insights.py tests/test_kb_linguistics_coverage.py tests/test_kb_neuroscience_coverage.py tests/test_kb_urban_coverage.py tests/test_lang_detection.py tests/test_mapping_contract.py tests/test_method_search.py tests/test_method_v13_main_reference.py tests/test_native_live_transport.py tests/test_native_ready_diagnostics.py tests/test_newsletter.py tests/test_observability_privacy.py tests/test_openapi_artifact.py tests/test_operational_logging_privacy.py tests/test_out_of_scope.py tests/test_papers_catalog.py tests/test_phenomenon_evidence.py tests/test_privacy.py tests/test_privacy_identifiers.py tests/test_private_auth_store.py tests/test_private_favorites.py tests/test_private_history_connection.py tests/test_private_history_