        python -m pytest tests/test_source_document_raw_lifecycle.py -p no:logging -x -ra -q --tb=short --durations=10

        python -m pytest tests/test_formal_main_history_read_borrow.py -p no:logging -x -ra -q --tb=short --durations=10

        python -m pytest tests/test_source_document_cached_history.py -p no:logging -x -ra -q --tb=short --durations=10

        python -m pytest tests/test_financial_limit_observer.py -p no:logging -x -ra -q --tb=short --durations=10

        python -m pytest tests/test_research_method_drafts.py --deselect=web/backend/tests/test_research_method_drafts.py::test_actual_native_plan_lead_is_bound_without_promoting_literature_or_formula -p no:logging -x -ra -q --tb=short --durations=10

