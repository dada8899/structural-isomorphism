name: Load smoke (k6)

# Manually triggered only — load tests are too expensive and too noisy
# to run on every PR. workflow_dispatch lets ops kick off a baseline run
# against staging or a custom URL on demand.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target environment'
        required: true
        type: choice
        default: 'beta'
        options:
          - beta
          - custom
      custom_url:
        description: 'Custom BASE_URL (only used when target=custom)'
        required: false
        type: string
        default: ''
      scenario:
        description: 'Scenario to run'
        required: true
        type: choice
        default: 'phases_smoke'
        options:
          - phases_smoke
          - ask_smoke
          - universality_smoke
          - mixed_realistic
          - stress_ramp
          - all
      vus_override:
        description: 'Override VUs (optional; e.g. "1" for prod sanity)'
        required: false
        type: string
        default: ''
      duration_override:
        description: 'Override duration (optional; e.g. "20s" for prod sanity)'
        required: false
        type: string
        default: ''
      unsafe_load_confirmation:
        description: 'Type "yes" to authorize stress_ramp or an uncapped custom load'
        required: false
        type: string
        default: ''

jobs:
  load-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: structural-production-beta-load
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
          k6 version

      - name: Resolve BASE_URL
        id: target
        env:
          TARGET: ${{ inputs.target }}
          CUSTOM_URL: ${{ inputs.custom_url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import ipaddress
          import os
          import re
          from urllib.parse import urlsplit, urlunsplit

          BETA_HOST = "beta.structural.bytedance.city"

          def fail(message: str) -> None:
              raise SystemExit(f"ERROR: {message}")

          target = os.environ.get("TARGET", "")
          if target == "beta":
              resolved = f"https://{BETA_HOST}"
          elif target == "custom":
              raw = os.environ.get("CUSTOM_URL", "")
              if not raw:
                  fail("custom target requires custom_url input")
              if any(ord(character) <= 32 or ord(character) == 127 for character in raw):
                  fail("custom_url must not contain whitespace or control characters")
              try:
                  parsed = urlsplit(raw)
                  port = parsed.port
                  hostname = parsed.hostname
              except ValueError as exc:
                  fail(f"invalid custom_url: {exc}")
              if parsed.scheme.lower() not in {"http", "https"}:
                  fail("custom_url must be an HTTP(S) URL")
              if parsed.username is not None or parsed.password is not None:
                  fail("custom_url must not contain userinfo")
              if parsed.path not in {"", "/"} or parsed.query or parsed.fragment:
                  fail("custom_url must be an origin without path, query, or fragment")
              if not hostname or "%" in parsed.netloc:
                  fail("custom_url must contain a literal hostname")
              raw_host = hostname.lower()
              if ":" in raw_host:
                  try:
                      address = ipaddress.ip_address(raw_host)
                  except ValueError:
                      fail("custom_url IPv6 hostname is invalid")
                  if address.version != 6:
                      fail("custom_url hostname is invalid")
                  canonical_host = address.compressed
              else:
                  try:
                      canonical_host = raw_host.encode("idna").decode("ascii").rstrip(".")
                  except UnicodeError:
                      fail("custom_url hostname is invalid")
                  if not canonical_host:
                      fail("custom_url hostname is empty after normalization")
                  try:
                      ipaddress.ip_address(canonical_host)
                  except ValueError:
                      labels = canonical_host.split(".")
                      label = re.compile(r"^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$")
                      if len(canonical_host) > 253 or any(
                          not label.fullmatch(part) for part in labels
                      ):
                          fail("custom_url DNS hostname is invalid")
              if canonical_host == BETA_HOST:
                  fail("select the beta target so production safety caps apply")
              rendered_host = f"[{canonical_host}]" if ":" in canonical_host else canonical_host
              netloc = rendered_host if port is None else f"{rendered_host}:{port}"
              resolved = urlunsplit((parsed.scheme.lower(), netloc, "", "", ""))
          else:
              fail("unsupported target")

          output = os.environ.get("GITHUB_OUTPUT")
          if not output:
              fail("GITHUB_OUTPUT is unavailable")
          with open(output, "a", encoding="utf-8") as handle:
              handle.write(f"url={resolved}\n")
          PY

      - name: Inspect scripts (parse-check, no execution)
        run: |
          for f in tests/load/*.js; do
            echo "--- inspect: $f ---"
            k6 inspect "$f" || { echo "PARSE FAIL: $f"; exit 1; }
          done

      - name: Run scenario(s)
        env:
          BASE_URL: ${{ steps.target.outputs.url }}
          TARGET: ${{ inputs.target }}
          SCENARIO: ${{ inputs.scenario }}
          VUS_OVERRIDE: ${{ inputs.vus_override }}
          DURATION_OVERRIDE: ${{ inputs.duration_override }}
          UNSAFE_LOAD_CONFIRMATION: ${{ inputs.unsafe_load_confirmation }}
        run: |
          set -euo pipefail
          mkdir -p tests/load/results

          if [ "$SCENARIO" = "stress_ramp" ] && [ "$UNSAFE_LOAD_CONFIRMATION" != "yes" ]; then
            echo 'ERROR: stress_ramp requires unsafe_load_confirmation="yes"'
            exit 1
          fi

          SAFE_CAP=0
          if [ "$SCENARIO" != "stress_ramp" ]; then
            if [ "$TARGET" = "beta" ] || [ "$UNSAFE_LOAD_CONFIRMATION" != "yes" ]; then
              SAFE_CAP=1
            fi
          fi
          if [ "$SAFE_CAP" = "1" ]; then
            case "$VUS_OVERRIDE" in
              ""|1) ;;
              *) echo "ERROR: unconfirmed load is capped at 1 VU"; exit 1 ;;
            esac
            case "$DURATION_OVERRIDE" in
              ""|20s) ;;
              *) echo "ERROR: unconfirmed load is capped at 20s"; exit 1 ;;
            esac
            VUS_OVERRIDE=1
            DURATION_OVERRIDE=20s
          fi

          run_one() {
            local script="$1"
            shift
            local args=(--max-redirects 0)
            if [ -n "$VUS_OVERRIDE" ]; then args+=(--vus "$VUS_OVERRIDE"); fi
            if [ -n "$DURATION_OVERRIDE" ]; then args+=(--duration "$DURATION_OVERRIDE"); fi
            echo "Running load scenario with ${#args[@]} CLI overrides: $script"
            BASE_URL="$BASE_URL" k6 run "${args[@]}" "$script"
          }

          case "$SCENARIO" in
            phases_smoke)      run_one tests/load/phases_smoke.js ;;
            ask_smoke)         run_one tests/load/ask_smoke.js ;;
            universality_smoke) run_one tests/load/universality_smoke.js ;;
            mixed_realistic)   run_one tests/load/mixed_realistic.js ;;
            stress_ramp)
              export I_KNOW_WHAT_I_AM_DOING="$UNSAFE_LOAD_CONFIRMATION"
              run_one tests/load/stress_ramp.js
              ;;
            all)
              run_one tests/load/phases_smoke.js
              run_one tests/load/ask_smoke.js
              run_one tests/load/universality_smoke.js
              run_one tests/load/mixed_realistic.js
              ;;
            *) echo "ERROR: unsupported scenario"; exit 1 ;;
          esac

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results-${{ inputs.scenario }}-${{ inputs.target }}
          path: tests/load/results/
          if-no-files-found: warn
          retention-days: 30
