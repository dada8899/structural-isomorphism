name: site smoke
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'   # every 6h
permissions:
  contents: read
concurrency:
  group: production-site-smoke
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run fail-closed production synthetic monitor
        run: python3 scripts/production_smoke.py --timeout 15
