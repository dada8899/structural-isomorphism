name: beta perf budget

on:
  pull_request:
    branches: [main, integration/structure-rebuild-v1]
  push:
    branches: [main, integration/structure-rebuild-v1, bootstrap/structure-ci-20261016]

permissions:
  contents: read

concurrency:
  group: beta-perf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  beta-perf-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked browser runtime
        run: |
          python -m pip install pytest==9.0.3 playwright==1.59.0 pydantic==2.7.4 PyYAML==6.0.3
          python -m playwright install --with-deps chromium
      - name: Run deterministic unit contracts
        run: >-
          python -m pytest
          tests/test_perf_audit.py
          tests/test_beta_perf_audit.py
          -q
      - name: Start local beta static server
        run: |
          python -m http.server 4173 --bind 127.0.0.1 --directory web/frontend > /tmp/beta-server.log 2>&1 &
          echo $! > /tmp/beta-server.pid
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/beta-server.log
          exit 1
      - name: Audit beta surfaces against the existing product budget
        id: beta_perf_gate
        run: >-
          python scripts/beta_perf_audit.py
          --base http://127.0.0.1:4173
          --runs 3
          --budget perf-budget.json
          --out /tmp/beta-perf-audit.json
      - name: NOT_GATE one marked Linux diagnostic pair
        id: beta_perf_diagnostic
        if: >-
          ${{ always() && !cancelled()
              && github.repository == 'dada8899/structural-isomorphism'
              && github.event_name == 'pull_request'
              && github.event.action == 'synchronize'
              && github.event.pull_request.number == 253
              && github.event.pull_request.head.repo.full_name == github.repository
              && github.event.pull_request.base.repo.full_name == github.repository
              && github.event.pull_request.head.ref == 'bootstrap/structure-ci-20261016'
              && github.run_attempt == '1' }}
        timeout-minutes: 5
        env:
          ORIGINAL_GRADE_OUTCOME: ${{ steps.beta_perf_gate.outcome }}
        run: >-
          python scripts/beta_perf_diagnostics.py
          --grade-artifact /tmp/beta-perf-audit.json
          --grade-outcome "$ORIGINAL_GRADE_OUTCOME"
          --base http://127.0.0.1:4173/
          --out "$RUNNER_TEMP/structure-perf-linux-r2-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Stop local beta server
        if: always()
        run: |
          if [ -f /tmp/beta-server.pid ]; then
            kill "$(cat /tmp/beta-server.pid)" 2>/dev/null || true
          fi
      - name: Upload beta performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-perf-audit
          path: |
            /tmp/beta-perf-audit.json
            /tmp/beta-server.log
      - name: Upload NOT_GATE Linux diagnostic evidence
        if: >-
          ${{ always() && !cancelled()
              && github.repository == 'dada8899/structural-isomorphism'
              && github.event_name == 'pull_request'
              && github.event.action == 'synchronize'
              && github.event.pull_request.number == 253
              && github.event.pull_request.head.repo.full_name == github.repository
              && github.event.pull_request.base.repo.full_name == github.repository
              && github.event.pull_request.head.ref == 'bootstrap/structure-ci-20261016'
              && github.run_attempt == '1'
              && (steps.beta_perf_diagnostic.outcome == 'success'
                  || steps.beta_perf_diagnostic.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: structure-perf-linux-r2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/structure-perf-linux-r2-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: ignore
