name: Runtime smoke (prod-shaped deps)

# Session #16 — close the SESSION-15-INCIDENT #2 gap.
#
# The five-day stale-deploy disaster in session #15 had multiple causes;
# one was: requirements.txt pinned a sentence-transformers version that
# *did* install in CI but, after a transitive dep upgrade in prod, no
# longer imported successfully at runtime. Our CI tests imported with
# the *test* deps only (mocked search), so the failure mode never showed
# up until the systemd service tried to load the real model.
#
# This workflow installs `web/backend/requirements.txt` EXACTLY as prod
# would (no test-only mocks) and tries to import every heavy dep + load
# the actual SearchService. It runs on every PR + nightly so we catch
# requirements drift before it ships.

on:
  push:
    branches: [main]
    paths:
      - 'web/backend/requirements.txt'
      - 'web/backend/services/search_service.py'
      - 'web/backend/services/llm_service.py'
      - 'web/backend/main.py'
      - '.github/workflows/runtime-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/backend/requirements.txt'
      - 'web/backend/services/search_service.py'
      - 'web/backend/services/llm_service.py'
      - 'web/backend/main.py'
      - '.github/workflows/runtime-smoke.yml'
  schedule:
    # Nightly at 06:00 UTC — catches transitive-dep regressions even
    # when no one touched requirements.txt.
    - cron: '0 6 * * *'
  workflow_dispatch: {}

concurrency:
  group: runtime-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  import-smoke:
    name: Import + model-load smoke (Linux, py3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: web/backend/requirements.txt

      - name: Install prod deps exactly as requirements.txt declares
        # No --upgrade, no test-only deps, no shortcuts. If this fails,
        # prod restart would also fail.
        run: |
          python -m pip install --upgrade pip
          pip install -r web/backend/requirements.txt

      - name: Install structural_isomorphism (the in-repo package)
        # SESSION-28: web/backend/services/search_service.py imports
        # `from structural_isomorphism.model import ...`. In prod, main.py
        # papers over this by sys.path.insert-ing the project root, but the
        # SearchService-load smoke step below runs `cd web/backend && python -`
        # directly and bypasses that hook, so it must see the package via the
        # normal resolution path. setup.py at repo root declares the package;
        # editable install is enough (no need to re-pin its deps because
        # requirements.txt above already pinned them).
        run: |
          pip install -e .

      - name: Import every heavy module that prod loads at startup
        # We do not load the actual KB embeddings (gated behind models/
        # restore on VPS). What we DO verify is that each import works
        # under the resolved transitive graph — exactly the failure mode
        # the session #15 incident missed.
        run: |
          python - <<'PY'
          import importlib, sys
          mods = [
              "sentence_transformers",
              "transformers",
              "torch",
              "httpx",
              "fastapi",
              "uvicorn",
              "pydantic",
              "slowapi",
              "structlog",
              "dotenv",
              "starlette",
          ]
          failed = []
          for m in mods:
              try:
                  importlib.import_module(m)
                  print(f"OK  {m}")
              except Exception as e:
                  print(f"FAIL {m}: {type(e).__name__}: {e}", file=sys.stderr)
                  failed.append(m)
          if failed:
              sys.exit(f"runtime smoke failed for: {failed}")
          PY

      - name: Load SearchService with a tiny in-memory KB
        # Construct the real SearchService class, pass it 2 dummy KB rows,
        # let it load the SentenceTransformer model and embed both. This
        # exercises (a) model download / load, (b) tokenizer compat, (c)
        # the path search_service.py walks at FastAPI startup.
        env:
          STRUCTURAL_LOG_LEVEL: WARNING
        run: |
          cd web/backend
          PYTHONPATH=. python - <<'PY'
          import json, tempfile, sys
          from pathlib import Path

          # Smallest viable KB — search_service.py reads (data_dir / kb_file).
          kb_rows = [
              {"id": "k1", "name": "test phenomenon 1", "domain": "test",
               "type_id": "T", "description": "A small test card."},
              {"id": "k2", "name": "test phenomenon 2", "domain": "test",
               "type_id": "T", "description": "Another small test card."},
          ]
          tmpdir = Path(tempfile.mkdtemp())
          kb_path = tmpdir / "smoke_kb.jsonl"
          with open(kb_path, "w") as f:
              for r in kb_rows:
                  f.write(json.dumps(r) + "\n")

          try:
              from services.search_service import SearchService
              svc = SearchService(data_dir=str(tmpdir), kb_file="smoke_kb.jsonl")
              # Verify it actually answers — model + tokenizer + encode path all live.
              hits = svc.search("test phenomenon", top_k=2)
              assert len(hits) >= 1, f"expected ≥1 hit, got {len(hits)}"
              print(f"OK SearchService loaded, kb_size={svc.kb_size}, hits={len(hits)}")
          except Exception as e:
              print(f"FAIL SearchService: {type(e).__name__}: {e}", file=sys.stderr)
              sys.exit(1)
          PY
