name: Runtime smoke (prod-shaped deps)

# Session #16 — close the SESSION-15-INCIDENT #2 gap.
#
# The five-day stale-deploy disaster in session #15 had multiple causes;
# one was: requirements.txt pinned a sentence-transformers version that
# *did* install in CI but, after a transitive dep upgrade in prod, no
# longer imported successfully at runtime. Our CI tests imported with
# the *test* deps only (mocked search), so the failure mode never showed
# up until the systemd service tried to load the real model.
#
# This workflow verifies the hash-locked Linux CPU runtime in its own Python
# 3.11 environment, then imports the actual checkout and runs SearchService.
# The generic model smoke is not production artifact/bundle acceptance.

on:
  push:
    branches: [main, integration/structure-rebuild-v1, bootstrap/structure-ci-20261016]
    paths:
      - 'web/backend/requirements.txt'
      - 'requirements/runtime-*.in'
      - 'requirements/runtime-*.lock'
      - 'web/backend/services/search_service.py'
      - 'web/backend/services/llm_service.py'
      - 'web/backend/main.py'
      - '.github/workflows/runtime-smoke.yml'
  pull_request:
    branches: [main, integration/structure-rebuild-v1]
    paths:
      - 'web/backend/requirements.txt'
      - 'requirements/runtime-*.in'
      - 'requirements/runtime-*.lock'
      - 'web/backend/services/search_service.py'
      - 'web/backend/services/llm_service.py'
      - 'web/backend/main.py'
      - '.github/workflows/runtime-smoke.yml'
  schedule:
    # Nightly at 06:00 UTC — catches transitive-dep regressions even
    # when no one touched requirements.txt.
    - cron: '0 6 * * *'
  workflow_dispatch: {}

concurrency:
  group: runtime-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  import-smoke:
    name: Import + model-load smoke (Linux, py3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Initialize isolated runtime paths
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?}" "${GITHUB_ENV:?}"
          printf 'RUNTIME_ENV=%s/structural-runtime-smoke\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'RUNTIME_PYTHON=%s/structural-runtime-smoke/bin/python\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            web/backend/requirements.txt
            v4/product/d1_phase_detector/api/requirements.txt
            requirements/runtime-linux-cpu.in
            requirements/runtime-linux-cpu.lock

      - name: Install pinned uv tool
        run: python -m pip install uv==0.11.8

      - name: Sync independent Python 3.11 Linux CPU runtime with hashes
        run: |
          set -euo pipefail
          python -c 'import sys; assert sys.version_info[:2] == (3, 11)'
          python -c 'import subprocess; assert subprocess.check_output(["uv", "--version"], text=True).split()[1] == "0.11.8"'
          test -s requirements/runtime-linux-cpu.lock
          uv venv --python "$(python -c 'import sys; print(sys.executable)')" \
            --no-managed-python --no-python-downloads "$RUNTIME_ENV"
          uv pip sync --python "$RUNTIME_PYTHON" --torch-backend cpu \
            --require-hashes --strict --no-python-downloads requirements/runtime-linux-cpu.lock
          uv pip check --python "$RUNTIME_PYTHON"

      - name: Write locked graph validator
        run: |
          cat > "$RUNNER_TEMP/structural-runtime-lock-check.py" <<'PY'
          import hashlib
          import importlib.metadata
          import json
          import platform
          import re
          import sys
          from pathlib import Path

          def normalize(name):
              return re.sub(r"[-_.]+", "-", name).lower()

          def locked_pins(text):
              pins, hashed, current = {}, set(), None
              for raw in text.splitlines():
                  line = raw.strip()
                  if not line or line.startswith("#"):
                      continue
                  if not raw[0].isspace():
                      match = re.fullmatch(r"([A-Za-z0-9][A-Za-z0-9_.-]*)==([^\\\s]+)\s*\\?", line)
                      if not match:
                          raise SystemExit("unsupported runtime lock record")
                      current = normalize(match[1])
                      if current in pins:
                          raise SystemExit("duplicate runtime lock distribution")
                      pins[current] = match[2]
                  elif re.fullmatch(r"--hash=sha256:[0-9a-f]{64}\s*\\?", line) and current:
                      hashed.add(current)
                  else:
                      raise SystemExit("unsupported runtime lock continuation")
              if len(pins) != 73 or hashed != set(pins):
                  raise SystemExit("expected 73 fully hashed runtime pins")
              return pins

          def verify_runtime(text, installed, torch_version, cuda_version, system, machine, python_version):
              pins = locked_pins(text)
              required = {"fastapi": "0.135.0", "pydantic": "2.7.4", "starlette": "1.3.1",
                          "pyjwt": "2.15.1", "uvicorn": "0.27.1", "httpx": "0.27.2",
                          "slowapi": "0.1.9", "structlog": "25.5.0", "torch": "2.14.1+cpu"}
              if any(pins.get(name) != version for name, version in required.items()):
                  raise SystemExit("runtime lock core versions differ from the approved bridge")
              if system != "Linux" or machine != "x86_64" or tuple(python_version) != (3, 11):
                  raise SystemExit("runtime lock requires Linux x86_64 CPython 3.11")
              if installed != pins:
                  raise SystemExit("installed distributions differ from the 73-package runtime lock")
              if any(name.startswith(("nvidia-", "cuda-")) for name in installed):
                  raise SystemExit("NVIDIA/CUDA distribution is forbidden in CPU smoke")
              if pins.get("torch") != "2.14.1+cpu" or torch_version != pins["torch"] or cuda_version is not None:
                  raise SystemExit("actual Torch build must be the locked CPU-only build")
              return pins

          def main():
              import torch
              lock = Path(sys.argv[1]).read_text(encoding="utf-8")
              installed = {}
              for distribution in importlib.metadata.distributions():
                  name = normalize(distribution.metadata["Name"])
                  if name in installed:
                      raise SystemExit("duplicate installed distribution")
                  installed[name] = distribution.version
              pins = verify_runtime(lock, installed, torch.__version__, torch.version.cuda,
                                    platform.system(), platform.machine(), sys.version_info[:2])
              print(json.dumps({"packages": len(pins), "versions": pins,
                                "lock_sha256": hashlib.sha256(lock.encode()).hexdigest(),
                                "torch_cuda": torch.version.cuda}, sort_keys=True))

          if __name__ == "__main__":
              main()
          PY

      - name: Verify locked graph before checkout imports
        run: |
          uv pip check --python "$RUNTIME_PYTHON"
          "$RUNTIME_PYTHON" -I "$RUNNER_TEMP/structural-runtime-lock-check.py" \
            "$GITHUB_WORKSPACE/requirements/runtime-linux-cpu.lock"

      - name: Import structural_isomorphism from the exact checkout
        env:
          PYTHONPATH: ${{ github.workspace }}
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          "$RUNTIME_PYTHON" - <<'PY'
          import importlib.util
          import os
          import subprocess
          from pathlib import Path
          root = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], cwd=root, text=True).strip()
          if actual != os.environ["EXPECTED_SOURCE_SHA"]:
              raise SystemExit("runtime smoke checkout SHA mismatch")
          spec = importlib.util.find_spec("structural_isomorphism")
          if spec is None or spec.origin is None or not Path(spec.origin).resolve().is_relative_to(root / "structural_isomorphism"):
              raise SystemExit("structural_isomorphism source resolves outside the checkout")
          import structural_isomorphism
          source = Path(structural_isomorphism.__file__).resolve()
          if not source.is_relative_to(root / "structural_isomorphism"):
              raise SystemExit("structural_isomorphism was imported from another checkout")
          print("checkout source imported:", actual, str(source.relative_to(root)))
          PY

      - name: Verify locked graph after checkout import
        run: |
          uv pip check --python "$RUNTIME_PYTHON"
          "$RUNTIME_PYTHON" -I "$RUNNER_TEMP/structural-runtime-lock-check.py" \
            "$GITHUB_WORKSPACE/requirements/runtime-linux-cpu.lock"

      - name: Import every heavy module that prod loads at startup
        # We do not load the actual KB embeddings (gated behind models/
        # restore on VPS). What we DO verify is that each import works
        # under the resolved transitive graph — exactly the failure mode
        # the session #15 incident missed.
        run: |
          "$RUNTIME_PYTHON" - <<'PY'
          import importlib, sys
          mods = [
              "sentence_transformers",
              "transformers",
              "torch",
              "httpx",
              "fastapi",
              "uvicorn",
              "pydantic",
              "slowapi",
              "structlog",
              "dotenv",
              "starlette",
          ]
          failed = []
          for m in mods:
              try:
                  importlib.import_module(m)
                  print(f"OK  {m}")
              except Exception as e:
                  print(f"FAIL {m}: {type(e).__name__}: {e}", file=sys.stderr)
                  failed.append(m)
          if failed:
              sys.exit(f"runtime smoke failed for: {failed}")
          PY

      - name: Load SearchService and answer with a generic model and tiny KB
        env:
          STRUCTURAL_LOG_LEVEL: WARNING
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/web/backend
        run: |
          "$RUNTIME_PYTHON" - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          from services.search_service import SearchService

          # Real model load/encode/query; this generic model is NOT the
          # production structural-v2 model or its bound artifact bundle.
          kb_rows = [
              {"id": "k1", "name": "test phenomenon 1", "domain": "test",
               "type_id": "T", "description": "A small test card."},
              {"id": "k2", "name": "test phenomenon 2", "domain": "test",
               "type_id": "T", "description": "Another small test card."},
          ]
          with tempfile.TemporaryDirectory(prefix="structural-runtime-smoke-") as directory:
              kb_path = Path(directory) / "smoke_kb.jsonl"
              kb_path.write_text("".join(json.dumps(row) + "\n" for row in kb_rows))
              service = SearchService(data_dir=directory, kb_file="smoke_kb.jsonl",
                                      model_path="shibing624/text2vec-base-chinese")
              hits = service.search("test phenomenon", top_k=2)
              if service.kb_size != 2 or not hits:
                  raise SystemExit("real SearchService load/answer failed")
              print(f"generic model smoke passed: kb_size={service.kb_size}, hits={len(hits)}")
          PY

      - name: Verify locked graph after SearchService smoke
        run: |
          uv pip check --python "$RUNTIME_PYTHON"
          "$RUNTIME_PYTHON" -I "$RUNNER_TEMP/structural-runtime-lock-check.py" \
            "$GITHUB_WORKSPACE/requirements/runtime-linux-cpu.lock"

      - name: Remove this job's isolated runtime
        if: always()
        run: |
          set -euo pipefail
          case "$RUNTIME_ENV" in
            "$RUNNER_TEMP"/structural-runtime-smoke) rm -rf -- "$RUNTIME_ENV" ;;
            *) echo "::error::Unexpected runtime cleanup path"; exit 1 ;;
          esac
          rm -f -- "$RUNNER_TEMP/structural-runtime-lock-check.py"
