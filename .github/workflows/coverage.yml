name: Coverage

# W11-A (session #10): coverage gate.
# Runs on every PR + push to main. Fails the build if global coverage on
# critical modules (v4/lib + packages/*/src + web/backend/api) drops below 80%.
# Per-file targets (≥90%): voting.py, multitest_correction.py, ask.py,
# checkout_mock.py, soc_pipeline/validate.py.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the production backend contract from its single source of
          # truth. A hand-maintained subset previously omitted ST, jieba,
          # rank-bm25 and multipart, while `|| true` hid the resulting errors.
          pip install -r web/backend/requirements.txt
          pip install coverage pytest 'openai>=1.0' scipy pandas powerlaw scikit-learn
          pip install -e packages/soc-pipeline
          pip install -e packages/cross-judge
          pip install -e packages/guarded-llm
          pip install -e packages/reject-aware-critic
      - name: Run coverage (split by suite, parallel files combined)
        run: |
          export PYTHONPATH=.
          PYTEST_FLAGS="-q --tb=short"
          # Each suite gets `-p` (--parallel-mode) so .coverage data lands
          # in suite-specific `.coverage.<host>.<pid>.*` files instead of
          # overwriting `.coverage`. Without -p, sequential `coverage run`
          # calls each overwrite the single `.coverage` file, leaving only
          # the LAST suite's data and breaking `coverage combine`. Bug
          # discovered W15 session #9: per-file gate saw stale 54.3% for
          # web/backend/api/ask.py (covered by web backend suite, then
          # overwritten by soc-pipeline run that only imports it).
          # Guarded-llm
          python -m coverage run -p --rcfile=.coveragerc -m pytest packages/guarded-llm/tests/ $PYTEST_FLAGS
          # Cross-judge
          python -m coverage run -p --rcfile=.coveragerc -m pytest packages/cross-judge/tests/ $PYTEST_FLAGS
          # Reject-aware critic
          python -m coverage run -p --rcfile=.coveragerc -m pytest packages/reject-aware-critic/tests/ $PYTEST_FLAGS
          # Web backend
          python -m coverage run -p --rcfile=.coveragerc -m pytest web/backend/tests/ $PYTEST_FLAGS
          # V4 sanity. soc-pipeline-primitives is covered separately by the
          # packages/soc-pipeline subset below (avoids double-counting), so
          # it's --ignore'd here. The PYTHONPATH shadow bug that previously
          # broke this test was fixed via v4/tests/conftest.py reordering.
          python -m coverage run -p --rcfile=.coveragerc -m pytest v4/tests/sanity --ignore=v4/tests/sanity/test_soc_pipeline_primitives.py $PYTEST_FLAGS
          # Soc-pipeline subset (skip slow LR/null/omori for CI speed)
          python -m coverage run -p --rcfile=.coveragerc -m pytest \
              packages/soc-pipeline/tests/test_utils.py \
              packages/soc-pipeline/tests/test_pandas_accessor.py \
              packages/soc-pipeline/tests/test_validate_w11a_coverage.py \
              packages/soc-pipeline/tests/test_b_value.py \
              packages/soc-pipeline/tests/test_universal_collapse.py \
              packages/soc-pipeline/tests/test_time_resolution.py \
              packages/soc-pipeline/tests/test_fit.py \
              $PYTEST_FLAGS
          python -m coverage combine --rcfile=.coveragerc
      - name: Coverage report
        run: |
          python -m coverage report --rcfile=.coveragerc --skip-empty
      - name: Generate coverage XML
        run: |
          python -m coverage xml --rcfile=.coveragerc -o coverage.xml
      - name: Per-critical-file ≥90% gate
        # Hard fail if any critical W11-A target drops below 90%.
        run: |
          set -e
          for f in \
            v4/lib/multitest_correction.py \
            web/backend/api/ask.py \
            web/backend/api/checkout_mock.py \
            packages/cross-judge/src/cross_judge/voting.py \
            packages/cross-judge/src/cross_judge/core.py \
            packages/soc-pipeline/src/soc_pipeline/validate.py \
          ; do
            echo "::group::$f"
            python -m coverage report --rcfile=.coveragerc --include="$f" --fail-under=90
            echo "::endgroup::"
          done
      - name: Global 80% gate (on covered subset)
        # Final guard: total coverage on the explicit source= list ≥80%.
        run: |
          python -m coverage report --rcfile=.coveragerc --fail-under=80 --skip-empty
      - name: Upload coverage XML artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14
