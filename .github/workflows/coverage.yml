name: Coverage

# W11-A (session #10): coverage gate.
# Runs on every PR + push to main. Fails the build if global coverage on
# critical modules (v4/lib + packages/*/src + web/backend/api) drops below 80%.
# Per-file targets (≥90%): voting.py, multitest_correction.py, ask.py,
# checkout_mock.py, soc_pipeline/validate.py.

on:
  push:
    branches: [main, integration/structure-rebuild-v1, bootstrap/structure-ci-20261016]
  pull_request:
    branches: [main, integration/structure-rebuild-v1]

jobs:
  coverage:
    runs-on: ubuntu-latest
    # Instrumented backend coverage alone needs 55 minutes; keep the remaining
    # offline suites and reports inside one finite execution budget.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the production backend contract from its single source of
          # truth. A hand-maintained subset previously omitted ST, jieba,
          # rank-bm25 and multipart, while `|| true` hid the resulting errors.
          pip install -r web/backend/requirements.txt
          pip install coverage pytest 'openai>=1.0' scipy pandas powerlaw scikit-learn
          pip install -e packages/soc-pipeline
          pip install -e packages/cross-judge
          pip install -e packages/guarded-llm
          pip install -e packages/reject-aware-critic
      - name: Run coverage (split by suite, parallel files combined)
        run: |
          export PYTHONPATH=.
          # A failing suite must report its first traceback before the deadline.
          PYTEST_FLAGS="-x -q --tb=short --durations=10"
          # Each suite gets `-p` (--parallel-mode) so .coverage data lands
          # in suite-specific `.coverage.<host>.<pid>.*` files instead of
          # overwriting `.coverage`. Without -p, sequential `coverage run`
          # calls each overwrite the single `.coverage` file, leaving only
          # the LAST suite's data and breaking `coverage combine`. Bug
          # discovered W15 session #9: per-file gate saw stale 54.3% for
          # web/backend/api/ask.py (covered by web backend suite, then
          # overwritten by soc-pipeline run that only imports it).
          # Guarded-llm
          python -m coverage run -p --rcfile=.coveragerc -m pytest packages/guarded-llm/tests/ $PYTEST_FLAGS
          # Cross-judge
          python -m coverage run -p --rcfile=.coveragerc -m pytest packages/cross-judge/tests/ $PYTEST_FLAGS
          # Reject-aware critic
          python -m coverage run -p --rcfile=.coveragerc -m pytest packages/reject-aware-critic/tests/ $PYTEST_FLAGS
          # Web backend
          python -m coverage run -p --rcfile=.coveragerc -m pytest web/backend/tests/ --ignore=web/backend/tests/test_formal_main_admission.py --ignore=web/backend/tests/test_formal_main_source_supervisor.py --ignore=web/backend/tests/test_research_financial_import.py --ignore=web/backend/tests/test_formal_model_startup.py --ignore=web/backend/tests/acceptance/test_source_history_fixture_current15.py --ignore=web/backend/tests/test_research_financial_registries.py --ignore=web/backend/tests/test_research_source_origin_history.py --ignore=web/backend/tests/test_research_evidence_method_plan.py --ignore=web/backend/tests/test_research_evidence_method_native.py --ignore=web/backend/tests/test_plan_runtime_transport.py --ignore=web/backend/tests/test_research_native_browser_service.py --ignore=web/backend/tests/test_native_live_grant.py --ignore=web/backend/tests/test_formal_native_plan_supervisor.py --ignore=web/backend/tests/test_research_financial_execution_v2.py --ignore=web/backend/tests/test_research_financial_results_v2.py --ignore=web/backend/tests/test_source_sec_access_lifecycle.py --ignore=web/backend/tests/test_source_document_raw_lifecycle.py --ignore=web/backend/tests/test_formal_main_history_read_borrow.py --ignore=web/backend/tests/test_source_document_cached_history.py --ignore=web/backend/tests/test_financial_limit_observer.py --ignore=web/backend/tests/test_research_method_drafts.py --deselect="web/backend/tests/test_research_native_plan.py::test_native_closed_allows_cost_preview_without_cash_or_funding_and_keeps_saved_question" --deselect="web/backend/tests/test_research_native_plan.py::test_native_actual_http_worker_single_requests_typed_saved_ref_no_cap_as_cash" --deselect="web/backend/tests/test_research_native_plan.py::test_native_preconnect_failure_is_before_consume_releases_reserved_hold" --deselect="web/backend/tests/test_research_native_plan.py::test_native_json_authority_and_foreign_types_cannot_install" --deselect="web/backend/tests/test_research_native_plan.py::test_native13_rows_and_shared_ledger_default_deny_without_scope[ordinary]" --deselect="web/backend/tests/test_research_native_plan.py::test_native13_rows_and_shared_ledger_default_deny_without_scope[private]" --deselect="web/backend/tests/test_research_native_plan.py::test_native_actual_owned_late_return_books_cost_without_reviving_body[cancel]" --deselect="web/backend/tests/test_research_native_plan.py::test_native_actual_owned_late_return_books_cost_without_reviving_body[delete]" --deselect="web/backend/tests/test_research_native_plan.py::test_native_owned_close_failure_keeps_booked_result_and_quarantines_resource" --deselect="web/backend/tests/test_research_native_plan.py::test_native_first_write_ambiguous_never_retries_and_keeps_held" --deselect="web/backend/tests/test_research_native_plan.py::test_native_retired_runtime_permit_cannot_retain_resource_sending_authority" --deselect="web/backend/tests/test_research_native_plan.py::test_review_pending_close_after_real_response_books_and_retires_owned_return" --deselect="web/backend/tests/test_research_native_plan.py::test_review_native_write_rejects_unrelated_or_unproduced_financial_changes[fake]" --deselect="web/backend/tests/test_research_native_plan.py::test_review_native_write_rejects_unrelated_or_unproduced_financial_changes[unrelated_owner]" --deselect="web/backend/tests/test_research_native_plan.py::test_review_native_write_rejects_unrelated_or_unproduced_financial_changes[actual_owner_noop]" --deselect="web/backend/tests/test_research_native_plan.py::test_review_native_write_rejects_unrelated_or_unproduced_financial_changes[money_wrapper_noop]" --deselect="web/backend/tests/test_research_native_plan.py::test_review_retired_native_permit_preview_is_closed_without_reading_balance" --deselect="web/backend/tests/test_research_native_plan.py::test_review_unknown_cleanup_preserves_every_execution_and_financial_field" --deselect="web/backend/tests/test_research_native_plan.py::test_review_funding_owner_binding_preserves_other_registered_accounts_closed_preview" --deselect="web/backend/tests/test_research_native_preowned.py::test_preowned_real_get_socket_close_after_physical_close_is_not_clean" --deselect="web/backend/tests/test_research_native_preowned.py::test_clean_low_balance_keeps_same_resource_for_new_legal_attempt" --deselect="web/backend/tests/test_research_native_preowned.py::test_allocated_connection_failure_is_owned_and_clean_retry_uses_same_resource" --deselect="web/backend/tests/test_research_native_preowned.py::test_all_core_retirements_precede_hook_and_flight_release_after_close_fault" --deselect="web/backend/tests/test_research_native_preowned.py::test_unreturned_allocated_socket_close_failure_keeps_original_error_and_uncertainty" --deselect="web/backend/tests/test_research_native_preowned.py::test_retire_hook_never_accepts_a_status_dto_as_clean" --deselect="web/backend/tests/test_research_native_schema_v13.py::test_real_old12_offline13_preserves_ledger_fixture_result_ref_time_newprocess" --deselect="web/backend/tests/test_research_native_schema_v13.py::test_native13_actual_kill_recovery_only_complete12_or13_with_same_ledger[journal]" --deselect="web/backend/tests/test_research_native_schema_v13.py::test_native13_actual_kill_recovery_only_complete12_or13_with_same_ledger[rebuild]" --deselect="web/backend/tests/test_research_native_schema_v13.py::test_native13_actual_kill_recovery_only_complete12_or13_with_same_ledger[resource]" --deselect="web/backend/tests/test_research_native_schema_v13.py::test_native13_actual_kill_recovery_only_complete12_or13_with_same_ledger[marker]" --deselect="web/backend/tests/test_research_native_schema_v13.py::test_native13_actual_kill_recovery_only_complete12_or13_with_same_ledger[before-commit]" --deselect="web/backend/tests/test_research_native_schema_v13.py::test_native13_actual_kill_recovery_only_complete12_or13_with_same_ledger[after-commit]" --deselect="web/backend/tests/test_research_plan_schema_v12.py::test_real_complete11_to12_same_inode_formula_ref_time_and_old_source_permission" --deselect="web/backend/tests/test_research_plan_schema_v12.py::test_v12_actual_kill_recovers_only_complete_old11_or_new12_same_formula_bytes[journal]" --deselect="web/backend/tests/test_research_plan_schema_v12.py::test_v12_actual_kill_recovers_only_complete_old11_or_new12_same_formula_bytes[rebuild]" --deselect="web/backend/tests/test_research_plan_schema_v12.py::test_v12_actual_kill_recovers_only_complete_old11_or_new12_same_formula_bytes[resource]" --deselect="web/backend/tests/test_research_plan_schema_v12.py::test_v12_actual_kill_recovers_only_complete_old11_or_new12_same_formula_bytes[marker]" --deselect="web/backend/tests/test_research_plan_schema_v12.py::test_v12_actual_kill_recovers_only_complete_old11_or_new12_same_formula_bytes[before-commit]" --deselect="web/backend/tests/test_research_plan_schema_v12.py::test_v12_actual_kill_recovers_only_complete_old11_or_new12_same_formula_bytes[after-commit]" $PYTEST_FLAGS
          python -m coverage run -p --rcfile=.coveragerc -m pytest web/backend/tests/test_formal_main_admission.py -p no:logging $PYTEST_FLAGS
          python -m coverage run -p --rcfile=.coveragerc -m pytest web/backend/tests/test_formal_main_source_supervisor.py -p no:logging $PYTEST_FLAGS
          python -m coverage run -p --rcfile=.coveragerc -m pytest web/backend/tests/test_research_financial_import.py -p no:logging $PYTEST_FLAGS
          python -m coverage run -p --rcfile=.coveragerc -m pytest web/backend/tests/test_formal_model_startup.py -p no:logging $PYTEST_FLAGS
          python -m coverage run -p --rcfile=.coveragerc -m pytest web/backend/tests/acceptance/test_source_history_fixture_current15.py -p no:logging $PYTEST_FLAGS
          python -m coverage run -p --rcfile=.coveragerc -m pytest web/backend/tests/test_research_financial_registries.py -p no:logging $PYTEST_FLAGS
          python -m coverage run -p --rcfile=.coveragerc -m pytest web/backend/tests/test_research_source_origin_history.py -p no:logging $PYTEST_FLAGS
          python -m coverage run -p --rcfile=.coveragerc -m pytest web/backend/tests/test_research_evidence_method_plan.py -p no:logging $PYTEST_FLAGS
          python -m coverage run -p --rcfile=.coveragerc -m pytest web/backend/tests/test_research_evidence_method_native.py -p no:logging $PYTEST_FLAGS
          python -m coverage run -p --rcfile=.coveragerc -m pytest web/backend/tests/test_plan_runtime_transport.py --deselect="web/backend/tests/test_plan_runtime_transport.py::test_evidence_runtime_first_socket_entry_is_recorded_once_and_never_refunded[partial]" -p no:logging $PYTEST_FLAGS
          python -m coverage run -p --rcfile=.coveragerc -m pytest web/backend/tests/test_research_native_browser_service.py -p no:logging $PYTEST_FLAGS
          python -m coverage run -p --rcfile=.coveragerc -m pytest web/backend/tests/test_native_live_grant.py -p no:logging $PYTEST_FLAGS
          python -m coverage run -p --rcfile=.coveragerc -m pytest web/backend/tests/test_formal_native_plan_supervisor.py -p no:logging $PYTEST_FLAGS
          python -m coverage run -p --rcfile=.coveragerc -m pytest web/backend/tests/test_research_financial_execution_v2.py -p no:logging $PYTEST_FLAGS
          python -m coverage run -p --rcfile=.coveragerc -m pytest web/backend/tests/test_research_financial_results_v2.py -p no:logging $PYTEST_FLAGS
          python -m coverage run -p --rcfile=.coveragerc -m pytest web/backend/tests/test_source_sec_access_lifecycle.py -p no:logging $PYTEST_FLAGS
          python -m coverage run -p --rcfile=.coveragerc -m pytest web/backend/tests/test_source_document_raw_lifecycle.py -p no:logging $PYTEST_FLAGS
          python -m coverage run -p --rcfile=.coveragerc -m pytest web/backend/tests/test_formal_main_history_read_borrow.py -p no:logging $PYTEST_FLAGS
          python -m coverage run -p --rcfile=.coveragerc -m pytest web/backend/tests/test_source_document_cached_history.py -p no:logging $PYTEST_FLAGS
          python -m coverage run -p --rcfile=.coveragerc -m pytest web/backend/tests/test_financial_limit_observer.py -p no:logging $PYTEST_FLAGS
          python -m coverage run -p --rcfile=.coveragerc -m pytest web/backend/tests/test_research_method_drafts.py --deselect=web/backend/tests/test_research_method_drafts.py::test_actual_native_plan_lead_is_bound_without_promoting_literature_or_formula -p no:logging $PYTEST_FLAGS
          # V4 sanity. soc-pipeline-primitives is covered separately by the
          # packages/soc-pipeline subset below (avoids double-counting), so
          # it's --ignore'd here. The PYTHONPATH shadow bug that previously
          # broke this test was fixed via v4/tests/conftest.py reordering.
          python -m coverage run -p --rcfile=.coveragerc -m pytest v4/tests/sanity --ignore=v4/tests/sanity/test_soc_pipeline_primitives.py $PYTEST_FLAGS
          # Soc-pipeline subset (skip slow LR/null/omori for CI speed)
          python -m coverage run -p --rcfile=.coveragerc -m pytest \
              packages/soc-pipeline/tests/test_utils.py \
              packages/soc-pipeline/tests/test_pandas_accessor.py \
              packages/soc-pipeline/tests/test_validate_w11a_coverage.py \
              packages/soc-pipeline/tests/test_b_value.py \
              packages/soc-pipeline/tests/test_universal_collapse.py \
              packages/soc-pipeline/tests/test_time_resolution.py \
              packages/soc-pipeline/tests/test_fit.py \
              $PYTEST_FLAGS
          # Root research contracts cover the unwired formula/provider modules;
          # they are not collected by the backend or package test directories.
          python -m coverage run -p --rcfile=.coveragerc -m pytest \
              tests/test_research_evidence.py \
              tests/test_research_sources.py \
              tests/test_research_formula.py \
              tests/test_research_provider_adapter.py \
              tests/test_research_model_report.py \
              tests/test_research_financial.py \
              tests/test_research_financial_result_adapter.py \
              tests/test_research_usage_upper.py \
              $PYTEST_FLAGS
          python -m coverage combine --rcfile=.coveragerc
      - name: Every production package has measured coverage
        run: |
          for source_dir in packages/*/src; do
            python -m coverage report \
              --rcfile=.coveragerc \
              --include="$source_dir/*" \
              --fail-under=1
          done
      - name: Coverage report
        run: |
          python -m coverage report --rcfile=.coveragerc --skip-empty
      - name: Generate coverage XML
        run: |
          python -m coverage xml --rcfile=.coveragerc -o coverage.xml
      - name: Per-critical-file ≥90% gate
        # Hard fail if any critical W11-A target drops below 90%.
        run: |
          set -e
          for f in \
            v4/lib/multitest_correction.py \
            web/backend/api/ask.py \
            web/backend/api/checkout_mock.py \
            packages/cross-judge/src/cross_judge/voting.py \
            packages/cross-judge/src/cross_judge/core.py \
            packages/soc-pipeline/src/soc_pipeline/validate.py \
          ; do
            echo "::group::$f"
            python -m coverage report --rcfile=.coveragerc --include="$f" --fail-under=90
            echo "::endgroup::"
          done
      - name: Global 80% gate (on covered subset)
        # Final guard: total coverage on the explicit source= list ≥80%.
        run: |
          python -m coverage report --rcfile=.coveragerc --fail-under=80 --skip-empty
      - name: Upload coverage XML artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14
