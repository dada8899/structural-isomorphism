name: mobile quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "web/frontend/**"
      - "web/phase-detector/**"
      - "web/tests/e2e/test_mobile_quality_audit.py"
      - ".github/workflows/mobile-quality.yml"

permissions:
  contents: read

jobs:
  mobile-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser runner
        run: |
          python -m pip install pytest playwright
          python -m playwright install --with-deps chromium
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: web/phase-detector/pnpm-lock.yaml
      - name: Install locked axe source
        working-directory: web/phase-detector
        run: pnpm install --frozen-lockfile
      - name: Enforce 375, 390 and 430 mobile quality
        run: pytest web/tests/e2e/test_mobile_quality_audit.py -v
