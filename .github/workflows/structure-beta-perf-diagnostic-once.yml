name: Structure Analyze mobile NOT_GATE once
on:
  push:
    branches: [codex/structure-analyze-mobile-setup-fixed-88830-attempt3]
permissions:
  contents: read
concurrency:
  group: structure-perf-once-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  analyze-mobile-not-gate:
    if: >-
      ${{ github.event_name == 'push'
          && github.repository == 'dada8899/structural-isomorphism'
          && github.ref == 'refs/heads/codex/structure-analyze-mobile-setup-fixed-88830-attempt3'
          && github.event.created == true
          && toJSON(github.event.deleted) == 'false'
          && github.run_attempt == '1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 88830a33000c3190901efd629081e9c41e259108
          path: source
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: diagnostic
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/structure_analyze_mobile_diagnostic_once.py
            scripts/prepare_ci_chromium.py
            scripts/verify_ci_chromium_setup.py
            .github/workflows/structure-beta-perf-diagnostic-once.yml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the original accepted ten SDK pins
        run: |
          python -m pip install \
            pytest==9.0.3 \
            playwright==1.59.0 \
            pytest-playwright==0.7.2 \
            fastapi==0.135.0 \
            pydantic==2.7.4 \
            starlette==1.3.1 \
            'uvicorn[standard]==0.27.1' \
            PyJWT==2.15.1 \
            slowapi==0.1.9 \
            structlog==25.5.0
      - name: Check fixed collector helper and verifier bytes
        working-directory: diagnostic
        run: |
          echo "55d1888f42c681b1b0d6a123117e7454d296e59b242f2de5b1658beea27e445a  scripts/structure_analyze_mobile_diagnostic_once.py" | sha256sum --check --strict
          echo "6801bdfc0678eec08343e8ec43753d54270df096ed7a3103bb10c0ea80376db2  scripts/prepare_ci_chromium.py" | sha256sum --check --strict
          echo "5e23286e542187729e60ae1ea32b508d02dee6ebd44d0563ba9a4be2576c37ac  scripts/verify_ci_chromium_setup.py" | sha256sum --check --strict
      - name: Verify fixed helper and snapshot metadata before setup
        id: setup_before
        working-directory: diagnostic
        run: python -I -B scripts/verify_ci_chromium_setup.py before
      - name: Invoke the fixed helper once without masking its exit
        id: setup_install
        working-directory: diagnostic
        run: python -I -B scripts/verify_ci_chromium_setup.py install
      - name: Always verify restoration and installed payload metadata
        id: postflight
        if: always()
        working-directory: diagnostic
        run: python -I -B scripts/verify_ci_chromium_setup.py after
      - name: Upload only the three public setup metadata records
        if: ${{ always() && steps.postflight.outputs.public_records_safe == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: chromium-setup-only-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/structure-chromium-setup-once-${{ github.run_id }}-${{ github.run_attempt }}/public/setup-before.json
            ${{ runner.temp }}/structure-chromium-setup-once-${{ github.run_id }}-${{ github.run_attempt }}/public/helper-outcome.json
            ${{ runner.temp }}/structure-chromium-setup-once-${{ github.run_id }}-${{ github.run_attempt }}/public/setup-after.json
          if-no-files-found: error
          include-hidden-files: false
      - name: One marked Analyze mobile capture, not a release grade
        if: >-
          ${{ success()
              && steps.setup_before.outcome == 'success'
              && steps.setup_install.outcome == 'success'
              && steps.postflight.outcome == 'success'
              && steps.postflight.outputs.public_records_safe == 'true' }}
        shell: bash
        run: |
          umask 077
          root="$RUNNER_TEMP/structure-beta-perf-once-$GITHUB_RUN_ID-1"
          mkdir -m 700 "$root" "$root/artifacts" "$root/work" "$root/work/home" "$root/work/tmp"
          timeout --kill-after=10s 150s env -i \
            PATH="$PATH" LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}" \
            HOME="$root/work/home" TMPDIR="$root/work/tmp" LANG=C.UTF-8 \
            PYTHONDONTWRITEBYTECODE=1 PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/ms-playwright" \
            RUNNER_TEMP="$RUNNER_TEMP" RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" \
            RUNNER_TRACKING_ID="$RUNNER_TRACKING_ID" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH" GITHUB_REF="$GITHUB_REF" \
            GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            python -I -B "$GITHUB_WORKSPACE/diagnostic/scripts/structure_analyze_mobile_diagnostic_once.py" \
              --source-root "$GITHUB_WORKSPACE/source" --out "$root/artifacts"
      - name: Retain only bounded JSON evidence, never browser profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structure-analyze-mobile-not-gate-${{ github.run_id }}-1
          path: ${{ runner.temp }}/structure-beta-perf-once-${{ github.run_id }}-1/artifacts/*.json
          if-no-files-found: warn
          include-hidden-files: false
