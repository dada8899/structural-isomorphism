name: Structure Analyze mobile NOT_GATE once
on:
  push:
    branches: [codex/structure-analyze-mobile-diagnostic-88830-attempt1]
permissions:
  contents: read
concurrency:
  group: structure-perf-once-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  analyze-mobile-not-gate:
    if: >-
      ${{ github.event_name == 'push'
          && github.repository == 'dada8899/structural-isomorphism'
          && github.ref == 'refs/heads/codex/structure-analyze-mobile-diagnostic-88830-attempt1'
          && github.event.created == true
          && toJSON(github.event.deleted) == 'false'
          && github.run_attempt == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 88830a33000c3190901efd629081e9c41e259108
          path: source
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: diagnostic
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Same locked dependencies as exact888 grading job
        run: |
          python -m pip install pytest==9.0.3 playwright==1.59.0 pydantic==2.7.4 PyYAML==6.0.3
          python -m playwright install --with-deps chromium
      - name: Check independent collector bytes before the one capture
        working-directory: diagnostic
        run: |
          echo "eb8820e62e08ecfa6edadf1e5da864e55d49b9fd014fff343d897c85c3ee619b  scripts/structure_analyze_mobile_diagnostic_once.py" | sha256sum --check --strict
      - name: One marked Analyze mobile capture, not a release grade
        shell: bash
        run: |
          umask 077
          root="$RUNNER_TEMP/structure-beta-perf-once-$GITHUB_RUN_ID-1"
          mkdir -m 700 "$root" "$root/artifacts" "$root/work" "$root/work/home" "$root/work/tmp"
          timeout --kill-after=10s 150s env -i \
            PATH="$PATH" LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}" \
            HOME="$root/work/home" TMPDIR="$root/work/tmp" LANG=C.UTF-8 \
            PYTHONDONTWRITEBYTECODE=1 PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/ms-playwright" \
            RUNNER_TEMP="$RUNNER_TEMP" RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" \
            RUNNER_TRACKING_ID="$RUNNER_TRACKING_ID" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_EVENT_PATH="$GITHUB_EVENT_PATH" GITHUB_REF="$GITHUB_REF" \
            GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            python -I -B "$GITHUB_WORKSPACE/diagnostic/scripts/structure_analyze_mobile_diagnostic_once.py" \
              --source-root "$GITHUB_WORKSPACE/source" --out "$root/artifacts"
      - name: Retain only bounded JSON evidence, never browser profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structure-analyze-mobile-not-gate-${{ github.run_id }}-1
          path: ${{ runner.temp }}/structure-beta-perf-once-${{ github.run_id }}-1/artifacts/*.json
          if-no-files-found: warn
          include-hidden-files: false
