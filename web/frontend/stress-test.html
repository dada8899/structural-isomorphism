<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FAFAF9">
  <meta name="description" content="结构压力测试——输入一个商业类比或战略判断，我们只做证伪：挑结构上成不成立、最可能从哪一环崩。">
  <title>结构压力测试 — Structural</title>

  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">

  <meta property="og:title" content="结构压力测试 — Structural">
  <meta property="og:description" content="输入一个类比，我们只做证伪——专门挑它从哪一环崩。">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/assets/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="结构压力测试 — Structural">
  <meta name="twitter:description" content="输入一个类比，我们只做证伪——专门挑它从哪一环崩。">

  <link rel="stylesheet" href="/assets/css/fonts-self-hosted.css?v=20260514a">
  <link rel="stylesheet" href="/assets/css/shared-tokens.css?v=20260514e">
  <link rel="stylesheet" href="/assets/css/reset.css?v=20260514e">
  <link rel="stylesheet" href="/assets/css/design-system.css?v=20260514e">
  <link rel="stylesheet" href="/assets/css/common.css?v=20260514e">
  <link rel="stylesheet" href="/assets/css/stress-test.css?v=20260522">
  <link rel="stylesheet" href="/assets/css/responsive.css?v=20260514e">

  <!-- Plausible analytics. -->
  <script defer data-domain="structural.bytedance.city" src="https://plausible.bytedance.city/js/script.js"></script>
</head>
<body>
  <header class="site-header"></header>

  <main class="stress-page">
    <div class="stress-container">
      <nav class="stress-crumb">
        <a href="/">首页</a>
        <span class="stress-crumb__sep">/</span>
        <span>结构压力测试</span>
      </nav>

      <!-- Intro: set the cold red-team tone up front -->
      <section class="stress-intro">
        <h1 class="stress-intro__title">结构压力测试</h1>
        <p class="stress-intro__lede">
          输入一个商业类比或战略判断。我们<strong>只做证伪</strong>——不夸、不顺着说，
          专门检查这个类比在结构上成不成立、最可能从哪一环崩。
        </p>
      </section>

      <!-- Input -->
      <section class="stress-input" id="stress-input">
        <label class="stress-input__label" for="stress-claim">你的类比 / 判断</label>
        <textarea
          id="stress-claim"
          class="stress-input__field"
          rows="3"
          maxlength="600"
          placeholder="例如：我们是中国版的 Notion / 这次 AI 泡沫和 2000 年互联网泡沫一样"></textarea>
        <div class="stress-input__row">
          <div class="stress-input__examples" id="stress-examples">
            <span class="stress-input__examples-label">试试：</span>
            <button type="button" class="stress-chip" data-claim="我们是中国版的 Notion">我们是中国版的 Notion</button>
            <button type="button" class="stress-chip" data-claim="这次 AI 泡沫和 2000 年互联网泡沫一样">这次 AI 泡沫和 2000 年泡沫一样</button>
            <button type="button" class="stress-chip" data-claim="社区电商就是线下版的拼多多">社区电商就是线下版的拼多多</button>
          </div>
          <button type="button" id="stress-submit" class="stress-submit">开始压力测试</button>
        </div>
        <div class="stress-input__error" id="stress-error" hidden></div>
      </section>

      <!-- Loading -->
      <section class="stress-loading" id="stress-loading" hidden>
        <div class="stress-loading__spinner" aria-hidden="true"></div>
        <p class="stress-loading__text">正在红队拆解这个类比……</p>
      </section>

      <!-- Result -->
      <section class="stress-result" id="stress-result" hidden>
        <!-- Verdict badge -->
        <div class="stress-verdict" id="stress-verdict">
          <span class="stress-verdict__badge" id="stress-verdict-badge"></span>
          <p class="stress-verdict__reason" id="stress-verdict-reason"></p>
        </div>

        <!-- Source vs Target -->
        <div class="stress-pair">
          <div class="stress-pair__col">
            <div class="stress-pair__role">被类比的对象</div>
            <div class="stress-pair__text" id="stress-source"></div>
          </div>
          <div class="stress-pair__vs" aria-hidden="true">vs</div>
          <div class="stress-pair__col">
            <div class="stress-pair__role">你的对象</div>
            <div class="stress-pair__text" id="stress-target"></div>
          </div>
        </div>

        <!-- Correspondences -->
        <div class="stress-section">
          <h2 class="stress-section__title">结构对应关系逐条压测</h2>
          <ul class="stress-corr-list" id="stress-corr-list"></ul>
        </div>

        <!-- Weakest link -->
        <div class="stress-weakest" id="stress-weakest">
          <div class="stress-weakest__label">最薄弱的一环</div>
          <p class="stress-weakest__text" id="stress-weakest-text"></p>

          <!-- Real KB precedent backing the weakest link -->
          <div class="stress-precedent" id="stress-precedent" hidden>
            <div class="stress-precedent__label">结构同构的真实先例</div>
            <a class="stress-precedent__phenom" id="stress-precedent-link" href="#">
              <span class="stress-precedent__domain" id="stress-precedent-domain"></span>
              <span class="stress-precedent__name" id="stress-precedent-name"></span>
            </a>
            <p class="stress-precedent__failure" id="stress-precedent-failure"></p>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer"></footer>

  <script src="/assets/js/i18n.js?v=20260514e"></script>
  <script src="/assets/js/utils.js?v=20260514e"></script>
  <script src="/assets/js/api.js?v=20260514e"></script>
  <script src="/assets/js/stress-test.js?v=20260522b"></script>
  <script src="/assets/js/product-switcher.js?v=20260514e"></script>
  <script src="/assets/js/site-chrome.js?v=20260521s17"></script>
</body>
</html>
