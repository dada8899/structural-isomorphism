  <main class="papers-page" id="main-content">
    <div class="papers-container">
      <section class="papers-hero" aria-labelledby="papers-heading">
        <p class="papers-hero__eyebrow">
          <span class="papers-hero__dot" aria-hidden="true"></span>
          <span data-i18n="page.papers.eyebrow">历史内部材料 · 尚未绑定当前证据账本</span>
        </p>
        <h1 class="papers-hero__title" id="papers-heading" data-i18n="page.papers.title">20 项历史研究材料</h1>
        <p class="papers-hero__lede" data-i18n="page.papers.lede">
          这里保留 14 份结果记录、5 份研究草稿与 1 份复现教程。它们可用于审计历史分析，但不能据此证明这些系统具有同一机制，也不代表外部同行评审、独立复现或当前可投稿结论。
        </p>

        <dl class="papers-stats" id="papers-stats" aria-label="材料构成">
          <div><dd class="papers-stat__num">20</dd><dt class="papers-stat__label" data-i18n="page.papers.stat_total">历史材料总数</dt></div>

      </section>

      <section class="papers-catalog" aria-labelledby="papers-catalog-heading">
        <div class="papers-catalog__heading-row">
          <h2 id="papers-catalog-heading" data-i18n="page.papers.catalog_title">按材料类型浏览</h2>
          <p class="sr-only" id="papers-filter-help" data-i18n="page.papers.filter_help">使用方向键切换筛选项</p>
        </div>
        <div class="papers-filter" id="papers-filter" role="toolbar" aria-label="材料类型筛选" aria-describedby="papers-filter-help">
          <button type="button" class="papers-filter__btn papers-filter__btn--active" data-filter="all" aria-pressed="true" tabindex="0" data-i18n="page.papers.filter_all">全部 20 项</button>
          <button type="button" class="papers-filter__btn" data-filter="unified" aria-pressed="false" tabindex="-1" data-i18n="page.papers.filter_unified">综合研究稿</button>

          <button type="button" class="papers-filter__btn" data-filter="tutorials" aria-pressed="false" tabindex="-1" data-i18n="page.papers.filter_tutorial">复现教程</button>
        </div>
        <p class="sr-only" id="papers-filter-status" role="status" aria-live="polite"></p>
        <div id="papers-content" aria-live="polite" aria-busy="true">
          <div class="papers-loading" role="status">
            <span class="papers-loading__dot" aria-hidden="true"></span>
            <span data-i18n="page.papers.loading">正在校验历史材料目录…</span>
          </div>
        </div>
      </section>

      <aside class="papers-footer-note" aria-label="材料边界">
