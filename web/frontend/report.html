<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>已保存的报告 — Structural</title>
  <meta name="description" content="A persisted Structural cross-domain isomorphism report.">
  <meta name="robots" content="noindex,nofollow">

  <link rel="stylesheet" href="/assets/css/fonts-self-hosted.css?v=20260521a">
  <link rel="stylesheet" href="/assets/css/shared-tokens.css?v=20260521a">
  <link rel="stylesheet" href="/assets/css/reset.css?v=20260521a">
  <link rel="stylesheet" href="/assets/css/design-system.css?v=20260521a">
  <link rel="stylesheet" href="/assets/css/common.css?v=20260521a">
  <link rel="stylesheet" href="/assets/css/analyze.css?v=20260521a">
  <link rel="stylesheet" href="/assets/css/analyze-actions.css?v=20260521a">
  <link rel="stylesheet" href="/assets/css/responsive.css?v=20260521a">

  <!-- KaTeX for inline math, same as analyze.html -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <!-- Plausible (telemetry) -->
  <script defer data-domain="beta.structural.bytedance.city"
          src="https://plausible.io/js/script.js"></script>
</head>
<body>
  <header class="site-header"></header>

  <main class="analyze-page">
    <div class="analyze-container">
      <nav class="analyze-crumb">
        <a href="/" class="analyze-crumb__link">Structural</a>
        <span class="analyze-crumb__sep">/</span>
        <span class="analyze-crumb__current">已保存的报告</span>
      </nav>

      <div id="report-loading" class="analyze-loading">
        <div class="analyze-loading__dots">
          <span class="analyze-loading__dot"></span>
          <span class="analyze-loading__dot"></span>
          <span class="analyze-loading__dot"></span>
        </div>
        <h2 class="analyze-loading__title">正在加载报告</h2>
      </div>

      <div id="report-error" class="analyze-loading" hidden>
        <h2 class="analyze-loading__title">报告不可用</h2>
        <p class="analyze-loading__hint" id="report-error-msg">
          这份报告可能已被删除,或链接已失效。
          <a href="/">返回首页</a> 重新生成。
        </p>
      </div>

      <div id="report-meta" class="analyze-header" hidden></div>

      <!-- Reuse the same share-bar structure so renderShareBar() works. -->
      <div id="analyze-share-bar" class="analyze-share-bar" hidden>
        <div class="analyze-share-bar__row">
          <span class="analyze-share-bar__icon">🔗</span>
          <input type="text" id="analyze-share-url" class="analyze-share-bar__url" readonly>
          <button type="button" id="analyze-share-copy" class="analyze-share-bar__btn">复制</button>
          <button type="button" id="analyze-share-open" class="analyze-share-bar__btn">打开</button>
        </div>
        <div class="analyze-share-bar__feedback">
          <span>这份报告对你有用吗?</span>
          <button type="button" class="analyze-vote analyze-vote--up"
                  data-section="" data-vote="1">👍 <span class="analyze-vote__count" id="analyze-vote-up-count">0</span></button>
          <button type="button" class="analyze-vote analyze-vote--down"
                  data-section="" data-vote="-1">👎 <span class="analyze-vote__count" id="analyze-vote-down-count">0</span></button>
        </div>
        <div id="analyze-share-bar__partial" class="analyze-share-bar__partial" hidden>
          ⚠ 报告未完整生成 — 分享前请确认.
        </div>
      </div>

      <div id="analyze-sections"></div>
    </div>
  </main>

  <footer class="site-footer"></footer>

  <!-- Self-host KaTeX render helper (analyze.js relies on it) -->
  <script>
    window.renderMath = function (root) {
      if (!root || typeof window.renderMathInElement !== 'function') return;
      try {
        window.renderMathInElement(root, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '$', right: '$', display: false },
            { left: '\\(', right: '\\)', display: false },
            { left: '\\[', right: '\\]', display: true },
          ],
          throwOnError: false,
        });
      } catch (e) { /* ignore */ }
    };
  </script>

  <!-- Pull in analyze.js for its section renderers + renderShareBar +
       submitFeedback. We DON'T run its DOMContentLoaded handler (which
       would try to open an SSE stream); we read window._m14_renderShareBar
       and the SECTIONS / renderers exports it set up. -->
  <script>window._suppressAnalyzeBoot = true;</script>
  <script src="/assets/js/i18n.js?v=20260521a"></script>
  <script src="/assets/js/analyze.js?v=20260521a"></script>
  <script src="/assets/js/report.js?v=20260521a"></script>
</body>
</html>
