<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>报告详情 — Structural</title>
  <meta name="description" content="一份已保存的 Structural 跨领域研究报告——把别的学科的成熟解法借到你的问题上。">
  <meta name="robots" content="noindex,nofollow">

  <link rel="stylesheet" href="/assets/css/fonts-self-hosted.css?v=20260521s17">
  <link rel="stylesheet" href="/assets/css/shared-tokens.css?v=20260521s17">
  <link rel="stylesheet" href="/assets/css/reset.css?v=20260521s17">
  <link rel="stylesheet" href="/assets/css/design-system.css?v=20260521s17">
  <link rel="stylesheet" href="/assets/css/common.css?v=20260713a">
  <link rel="stylesheet" href="/assets/css/evidence-envelope.css?v=20260713a">
  <link rel="stylesheet" href="/assets/css/analyze.css?v=20260521v2">
  <link rel="stylesheet" href="/assets/css/decision-brief.css?v=20260712a">
  <link rel="stylesheet" href="/assets/css/analyze-actions.css?v=20260521s17">
  <link rel="stylesheet" href="/assets/css/responsive.css?v=20260713a">

  <!-- KaTeX for inline math — version aligned with analyze.html (0.16.11). -->
  <link rel="stylesheet" href="/assets/vendor/katex/katex.min.css?v=0.16.11">
  <script defer src="/assets/vendor/katex/katex.min.js?v=0.16.11"></script>
  <script defer src="/assets/vendor/katex/contrib/auto-render.min.js?v=0.16.11"></script>

  <!-- Plausible (telemetry) — self-hosted instance, consistent with the rest
       of the site. -->
  <script defer data-domain="structural.bytedance.city"
          src="https://plausible.bytedance.city/js/script.js"></script>
  <!-- Plausible analytics (W7-D mini-brief 5, 2026-05-24). -->
  <script defer data-domain="structural.bytedance.city" src="https://plausible.bytedance.city/js/script.js"></script>
</head>
<body class="is-warmink">
  <header class="site-header"></header>

  <main class="analyze-page">
    <div class="analyze-container">
      <nav class="analyze-crumb">
        <a href="/" class="analyze-crumb__link">Structural</a>
        <span class="analyze-crumb__sep">/</span>
        <span class="analyze-crumb__current">报告详情</span>
      </nav>

      <div id="report-loading" class="analyze-loading">
        <div class="analyze-loading__dots">
          <span class="analyze-loading__dot"></span>
          <span class="analyze-loading__dot"></span>
          <span class="analyze-loading__dot"></span>
        </div>
        <h2 class="analyze-loading__title">正在加载报告</h2>
      </div>

      <div id="report-error" class="report-errorcard" hidden>
        <div class="report-errorcard__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/>
          </svg>
        </div>
        <h2 class="report-errorcard__title">没找到这份报告</h2>
        <p class="report-errorcard__msg" id="report-error-msg">
          这个链接可能已经失效，或报告已被删除。你可以回首页提一个新问题，或在「我的报告」里找找保存过的。
        </p>
        <div class="report-errorcard__actions">
          <a href="/" class="report-errorcard__cta">回首页提新问题</a>
          <a href="/reports" class="report-errorcard__cta report-errorcard__cta--ghost">查看我的报告</a>
        </div>
      </div>

      <div id="report-meta" class="analyze-header" hidden></div>

      <!-- Reuse the same share-bar structure so renderShareBar() works. -->
      <div id="analyze-share-bar" class="analyze-share-bar" hidden>
        <div class="analyze-share-bar__row">
          <span class="analyze-share-bar__icon">🔗</span>
          <input type="text" id="analyze-share-url" class="analyze-share-bar__url" readonly>
          <button type="button" id="analyze-share-copy" class="analyze-share-bar__btn">复制</button>
          <button type="button" id="analyze-share-open" class="analyze-share-bar__btn">打开</button>
        </div>
        <div class="analyze-share-bar__feedback">
          <span>这份报告对你有用吗？</span>
          <button type="button" class="analyze-vote analyze-vote--up"
                  data-section="" data-vote="1">👍 <span class="analyze-vote__count" id="analyze-vote-up-count">0</span></button>
          <button type="button" class="analyze-vote analyze-vote--down"
                  data-section="" data-vote="-1">👎 <span class="analyze-vote__count" id="analyze-vote-down-count">0</span></button>
        </div>
        <div id="analyze-share-bar__partial" class="analyze-share-bar__partial" hidden>
          ⚠ 报告未完整生成 —— 分享前请确认。
        </div>
      </div>

      <!-- SESSION-17 V1: core insight card, rendered by analyze.js's
           renderTldrCard from the persisted payload. -->
      <div id="analyze-tldr" class="analyze-tldr" hidden></div>
      <div id="decision-brief-root"></div>

      <div id="analyze-sections"></div>
    </div>
  </main>

  <footer class="site-footer"></footer>

  <!-- Self-host KaTeX render helper (analyze.js relies on it) -->
  <script>
    window.renderMath = function (root) {
      if (!root || typeof window.renderMathInElement !== 'function') return;
      try {
        window.renderMathInElement(root, {
          delimiters: [
            { left: '$$', right: '$$', display: true },
            { left: '$', right: '$', display: false },
            { left: '\\(', right: '\\)', display: false },
            { left: '\\[', right: '\\]', display: true },
          ],
          throwOnError: false,
        });
      } catch (e) { /* ignore */ }
    };
  </script>

  <!-- Pull in analyze.js for its section renderers + renderShareBar +
       submitFeedback. We DON'T run its DOMContentLoaded handler (which
       would try to open an SSE stream); we read window._m14_renderShareBar
       and the SECTIONS / renderers exports it set up. -->
  <script>window._suppressAnalyzeBoot = true;</script>
  <script src="/assets/js/i18n.js?v=20260713a"></script>
  <!-- utils.js defines `$` and other helpers analyze.js's renderFinalReport
       relies on — must load before analyze.js (mirrors analyze.html). -->
  <script src="/assets/js/utils.js?v=20260521a"></script>
  <script src="/assets/js/evidence-envelope.js?v=20260713a"></script>
  <script src="/assets/js/analyze.js?v=20260713a"></script>
  <script src="/assets/js/report.js?v=20260713a"></script>
  <script src="/assets/js/site-chrome.js?v=20260713a"></script>
</body>
</html>
