  <!-- W4-A CLS fix (2026-05-14): pre-reserve history-sidebar padding so
       layout doesn't shift when history-sidebar.js late-injects its

       The JS-injected rule lives in history-sidebar.js → we duplicate
       the desktop padding declaration in static CSS so it applies on
       first paint. Mobile (< 1024px) has no padding so no need.       -->

          <div class="disc-skeleton-stats" aria-hidden="true"></div>

        <div class="disc-skeleton-card" aria-hidden="true"></div>
