<body>
  <header class="site-header"></header>

  <main class="paper-page">
    <div class="paper-container">
      <div class="paper-breadcrumb">
        <a href="/classes" data-i18n="page.paper.crumb_back">← 共享模式</a>
        <span class="paper-breadcrumb__sep">/</span>
        <span class="paper-breadcrumb__current">Layer 5 Phase 1 · SOC × USGS Earthquakes</span>
      </div>

      <article class="paper-article" id="paper-article">
        <div class="paper-skeleton">
          <div class="paper-skeleton__line paper-skeleton__line--title"></div>
          <div class="paper-skeleton__line"></div>
          <div class="paper-skeleton__line"></div>
          <div class="paper-skeleton__line"></div>
          <div class="paper-skeleton__line paper-skeleton__line--short"></div>
        </div>
      </article>

      <div class="paper-footer-actions">
        <a class="paper-action" id="paper-download-md" download data-i18n="page.paper.dl_md">⬇ 下载 Markdown 原文</a>
        <a class="paper-action" href="https://github.com/dada8899/structural-isomorphism/tree/main/v4/validation/soc-earthquake" target="_blank" rel="noopener" data-i18n="page.paper.source_gh">📂 源代码与数据 (GitHub)</a>
        <a class="paper-action" href="/classes"  data-i18n="page.paper.back_to_list">← 回到共享模式目录</a>
      </div>
    </div>
  </main>

  <footer class="site-footer"></footer>

  <script>
    function T(key, fallback) { try { if (window.i18n && typeof window.i18n.t === "function") { var v = window.i18n.t(key); if (v && v !== key) return v; } } catch(e) {} return fallback; }
    (function () {
      const urlParams = new URLSearchParams(window.location.search);
      const pathMatch = window.location.pathname.match(/^\/paper\/([a-zA-Z0-9\-_.]+)/);
      let docSlug = (pathMatch && pathMatch[1]) || urlParams.get("doc") || "soc-earthquake-2026-04-15";
      // whitelist against directory traversal (allow dots for version slugs e.g. v0.2)
      docSlug = docSlug.replace(/[^a-zA-Z0-9\-_.]/g, "");
      // Defense in depth: forbid leading dot / .. / consecutive dots
      if (docSlug.startsWith(".") || docSlug.indexOf("..") !== -1) docSlug = "soc-earthquake-2026-04-15";
      if (!docSlug) docSlug = "soc-earthquake-2026-04-15";
      const mdUrl = `/assets/data/papers/${docSlug}.md`;
      const target = document.getElementById("paper-article");
      const dl = document.getElementById("paper-download-md");
      if (dl) dl.href = mdUrl;

      function render(md) {
        if (typeof marked === "undefined") {
          target.innerHTML = `<p style='color:***REMOVED***c44;'>${T("page.paper.md_loader_failed", "Markdown 渲染器加载失败.")}</p>`;
          return;
        }
        marked.setOptions({ gfm: true, breaks: false });
        const html = marked.parse(md);
        target.innerHTML = html;
        // Extract first h1 as title
        const h1 = target.querySelector("h1");
        if (h1) {
          document.getElementById("paper-title").textContent = h1.textContent + " — Structural";
        }
        if (window.renderMathInElement) {
          try {
            window.renderMathInElement(target, {
              delimiters: [
                { left: "$$", right: "$$", display: true },
                { left: "\\[", right: "\\]", display: true },
                { left: "$", right: "$", display: false },
                { left: "\\(", right: "\\)", display: false },
              ],
              throwOnError: false,
            });
          } catch (e) {
            console.warn("KaTeX render failed", e);
          }
        }
      }

      fetch(mdUrl)
        .then((r) => {
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          return r.text();
        })
        .then((md) => {
          if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", () => render(md));
          } else {
            render(md);
          }
        })
        .catch((e) => {
          target.innerHTML = `<p style="color:***REMOVED***c44; text-align:center; padding:60px 0;">${T("page.paper.load_failed", "论文加载失败")}: ${e.message}</p>`;
        });
    })();
  </script>
  <script src="/assets/js/i18n.js?v=20260417e"></script>
  <script src="/assets/js/utils.js?v=20260417e"></script>
  <script src="/assets/js/history-sidebar.js?v=20260514"></script>
  <script src="/assets/js/product-switcher.js?v=20260417e"></script>
  <script src="/assets/js/site-chrome.js?v=20260521s17"></script>
</body>
</html>
