<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FAFAF9">
  <title>数据洞察 — Structural</title>
  <meta name="description" content="公开结果聚合当前暂停；参与变化不会生成公开人数、排行、卡片或可信度信号。">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">

  <link rel="stylesheet" href="/assets/css/fonts-self-hosted.css?v=20260522a">
  <link rel="stylesheet" href="/assets/css/shared-tokens.css?v=20260522a">
  <link rel="stylesheet" href="/assets/css/reset.css?v=20260522a">
  <link rel="stylesheet" href="/assets/css/design-system.css?v=20260522a">
  <link rel="stylesheet" href="/assets/css/common.css?v=20260714n2">
  <link rel="stylesheet" href="/assets/css/evidence-envelope.css?v=20260713n1">
  <link rel="stylesheet" href="/assets/css/responsive.css?v=20260714n2">
  <link rel="stylesheet" href="/assets/css/insights.css?v=20260522s18">

  <!-- Plausible analytics (self-hosted, cookieless — matches the rest of the site). -->
  <script defer src="/assets/js/analytics-consent.js?v=20260714n2"></script>
</head>
<body>
  <header class="site-header"></header>

  <main class="insights-page">
    <div class="insights-container">

      <div class="insights-head">
        <h1 class="insights-head__title">数据洞察</h1>
        <p class="insights-head__sub">公开结果聚合当前暂停。我们不会根据参与人数展示档位、排行或卡片，也不会把用户反馈写成机制验证；用户记录不替代对照实验或独立复现，你保存的实验结果仍属于自己的研究记录。</p>
      </div>

      <!-- 总览数字卡 -->
      <section class="insights-summary" id="insights-summary" aria-label="总览数字">
        <div class="insights-stat insights-stat--skeleton"></div>
        <div class="insights-stat insights-stat--skeleton"></div>
        <div class="insights-stat insights-stat--skeleton"></div>
        <div class="insights-stat insights-stat--skeleton"></div>
      </section>

      <!-- 最常卡住的问题结构 -->
      <section class="insights-block" aria-labelledby="insights-stuck-title">
        <h2 class="insights-block__title" id="insights-stuck-title">问题结构排行</h2>
        <p class="insights-block__sub">当前关闭。暂停期间不读取真实参与人数生成、筛选或排序结果。</p>
        <div id="insights-stuck" class="insights-stuck">
          <div class="insights-row insights-row--skeleton"></div>
          <div class="insights-row insights-row--skeleton"></div>
          <div class="insights-row insights-row--skeleton"></div>
        </div>
      </section>

      <!-- 用户结果记录 -->
      <section class="insights-block" aria-labelledby="insights-verified-title">
        <h2 class="insights-block__title" id="insights-verified-title">公开用户结果</h2>
        <p class="insights-block__sub">当前关闭。任何新记录、撤回或人数变化都不会生成公开卡片。</p>
        <div id="insights-verified" class="insights-verified">
          <div class="insights-card insights-card--skeleton"></div>
          <div class="insights-card insights-card--skeleton"></div>
        </div>
      </section>

    </div>
  </main>

  <footer class="site-footer"></footer>

  <script src="/assets/js/i18n.js?v=20260714n2"></script>
  <script src="/assets/js/evidence-envelope.js?v=20260714n2"></script>
  <script src="/assets/js/insights.js?v=20260714n2"></script>
  <script src="/assets/js/site-chrome.js?v=20260714n2"></script>
</body>
</html>
