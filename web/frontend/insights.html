<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FAFAF9">
  <title>数据洞察 — Structural</title>
  <meta name="description" content="用户最常遇到的问题结构与主动回填的迁移结果记录；用户反馈不等于机制验证。">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">

  <link rel="stylesheet" href="/assets/css/fonts-self-hosted.css?v=20260522a">
  <link rel="stylesheet" href="/assets/css/shared-tokens.css?v=20260522a">
  <link rel="stylesheet" href="/assets/css/reset.css?v=20260522a">
  <link rel="stylesheet" href="/assets/css/design-system.css?v=20260522a">
  <link rel="stylesheet" href="/assets/css/common.css?v=20260713a">
  <link rel="stylesheet" href="/assets/css/evidence-envelope.css?v=20260713a">
  <link rel="stylesheet" href="/assets/css/responsive.css?v=20260713a">
  <link rel="stylesheet" href="/assets/css/insights.css?v=20260522s18">

  <!-- Plausible analytics (self-hosted, cookieless — matches the rest of the site). -->
  <script defer data-domain="structural.bytedance.city"
          src="https://plausible.bytedance.city/js/script.js"></script>
</head>
<body>
  <header class="site-header"></header>

  <main class="insights-page">
    <div class="insights-container">

      <div class="insights-head">
        <h1 class="insights-head__title">数据洞察</h1>
        <p class="insights-head__sub">这里汇总常见问题结构和用户主动回填的迁移结果。它能说明“有人这样尝试并记录了结果”，不能单凭反馈证明两个领域共享同一机制。</p>
      </div>

      <!-- 总览数字卡 -->
      <section class="insights-summary" id="insights-summary" aria-label="总览数字">
        <div class="insights-stat insights-stat--skeleton"></div>
        <div class="insights-stat insights-stat--skeleton"></div>
        <div class="insights-stat insights-stat--skeleton"></div>
        <div class="insights-stat insights-stat--skeleton"></div>
      </section>

      <!-- 最常卡住的问题结构 -->
      <section class="insights-block" aria-labelledby="insights-stuck-title">
        <h2 class="insights-block__title" id="insights-stuck-title">最常卡住的问题结构</h2>
        <p class="insights-block__sub">用户提问最集中的目标现象。回访率与「确实管用」率越高，说明这条跨领域路线越靠谱。</p>
        <div id="insights-stuck" class="insights-stuck">
          <div class="insights-row insights-row--skeleton"></div>
          <div class="insights-row insights-row--skeleton"></div>
          <div class="insights-row insights-row--skeleton"></div>
        </div>
      </section>

      <!-- 用户结果记录 -->
      <section class="insights-block" aria-labelledby="insights-verified-title">
        <h2 class="insights-block__title" id="insights-verified-title">用户结果记录</h2>
        <p class="insights-block__sub">这里是用户主动回填的单次结果，比纯模型分多一层使用记录；仍可能有选择偏差，也不替代对照实验或独立复现。</p>
        <div id="insights-verified" class="insights-verified">
          <div class="insights-card insights-card--skeleton"></div>
          <div class="insights-card insights-card--skeleton"></div>
        </div>
      </section>

    </div>
  </main>

  <footer class="site-footer"></footer>

  <script src="/assets/js/i18n.js?v=20260713a"></script>
  <script src="/assets/js/evidence-envelope.js?v=20260713b"></script>
  <script src="/assets/js/insights.js?v=20260713a"></script>
  <script src="/assets/js/site-chrome.js?v=20260713a"></script>
</body>
</html>
