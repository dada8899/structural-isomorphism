<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="***REMOVED***FAFAF9">
  <meta name="description" content="给一份策略/方案文档做体检——抽出里面的隐含假设、跨域类比、因果判断，逐条标出结构性风险和失效模式。">
  <title>策略文档体检 — Structural</title>

  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">

  <meta property="og:title" content="策略文档体检 — Structural">
  <meta property="og:description" content="像代码审查一样审查你的策略文档 · 标出结构性风险">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/assets/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="策略文档体检 — Structural">
  <meta name="twitter:description" content="像代码审查一样审查你的策略文档 · 标出结构性风险">

  <link rel="stylesheet" href="/assets/css/fonts-self-hosted.css?v=20260514a">

  <link rel="stylesheet" href="/assets/css/shared-tokens.css?v=20260514e">
  <link rel="stylesheet" href="/assets/css/reset.css?v=20260514e">
  <link rel="stylesheet" href="/assets/css/design-system.css?v=20260514e">
  <link rel="stylesheet" href="/assets/css/common.css?v=20260514e">
  <link rel="stylesheet" href="/assets/css/lint.css?v=20260522">
  <link rel="stylesheet" href="/assets/css/responsive.css?v=20260514e">

  <!-- Plausible analytics. -->
  <script defer data-domain="structural.bytedance.city" src="https://plausible.bytedance.city/js/script.js"></script>
</head>
<body>
  <header class="site-header"></header>

  <main class="lint-page">
    <div class="lint-container">
      <nav class="lint-crumb">
        <a href="/">首页</a>
        <span class="lint-crumb__sep">/</span>
        <span>策略文档体检</span>
      </nav>

      <!-- Input state -->
      <section id="lint-input" class="lint-input">
        <h1 class="lint-input__title">策略文档体检</h1>
        <p class="lint-input__intro">
          粘贴一份策略 / 方案文档。我们会像代码审查一样逐条找出里面的<strong>隐含假设</strong>、<strong>跨域类比</strong>和<strong>因果判断</strong>，
          标出每一条的底层结构、最常见的失效模式和结构性风险。简单说：在文档交出去之前，先帮你挑一遍刺。
        </p>
        <textarea
          id="lint-textarea"
          class="lint-textarea"
          placeholder="把你的策略文档、方案、规划粘贴到这里——例如「我们计划复制小米的生态链模式，先用一款爆品打开市场，再横向扩张到周边品类，靠规模摊薄成本……」"
          maxlength="20000"
          rows="14"
          aria-label="策略文档内容"></textarea>
        <div class="lint-input__bar">
          <span id="lint-charcount" class="lint-charcount">0 / 20000</span>
          <button type="button" id="lint-submit" class="lint-submit">开始体检</button>
        </div>
        <p id="lint-input-error" class="lint-input__error" hidden></p>
        <div class="lint-examples" id="lint-examples">
          <span class="lint-examples__label">没有现成文档？试个示例：</span>
          <button type="button" class="lint-chip" data-example="我们计划复制小米的生态链模式：先用一款高性价比爆品打开市场，建立品牌信任，再横向扩张到周边品类，靠统一供应链和规模效应摊薄成本。只要爆品成功，后面的品类就能顺势带起来。">小米生态链复制</button>
          <button type="button" class="lint-chip" data-example="过去三个季度增长强劲，说明我们的增长引擎已经跑通。下一步只要把市场预算翻倍投入，增长就能线性放大。竞争对手反应慢，我们有先发优势的时间窗口。">增长引擎已跑通</button>
          <button type="button" class="lint-chip" data-example="用户留存率最近上升了，证明产品体验改进起了作用。我们应该继续沿这个方向加大功能投入。团队士气也很高，大家都觉得方向是对的。">留存上升归因</button>
        </div>
      </section>

      <!-- Loading state -->
      <section id="lint-loading" class="lint-loading" hidden>
        <div class="lint-loading__dots">
          <span class="lint-loading__dot"></span>
          <span class="lint-loading__dot"></span>
          <span class="lint-loading__dot"></span>
        </div>
        <h2 class="lint-loading__title">正在做文档体检</h2>
        <p class="lint-loading__hint">我们在逐条抽取文档里的结构性主张并比对失效模式，约需 20–40 秒。</p>
        <span class="lint-loading__timer" id="lint-loading-timer">已等待 0s</span>
      </section>

      <!-- Error state -->
      <section id="lint-error" class="lint-error" hidden>
        <div class="lint-error__icon" aria-hidden="true">!</div>
        <h2 class="lint-error__title">文档体检失败</h2>
        <p id="lint-error-msg" class="lint-error__msg"></p>
        <button type="button" id="lint-retry" class="lint-submit lint-submit--ghost">返回重试</button>
      </section>

      <!-- Result state -->
      <section id="lint-result" class="lint-result" hidden>
        <div class="lint-summary">
          <span class="lint-summary__label">整体结构性风险</span>
          <p id="lint-summary-text" class="lint-summary__text"></p>
        </div>
        <div class="lint-result__head">
          <h2 class="lint-result__title">逐条结构主张</h2>
          <span id="lint-result-count" class="lint-result__count"></span>
        </div>
        <div id="lint-claims" class="lint-claims"></div>
        <button type="button" id="lint-again" class="lint-submit lint-submit--ghost">分析另一份文档</button>
      </section>
    </div>
  </main>

  <footer class="site-footer"></footer>

  <script src="/assets/js/i18n.js?v=20260514e"></script>
  <script src="/assets/js/utils.js?v=20260514e"></script>
  <script src="/assets/js/api.js?v=20260514e"></script>
  <script src="/assets/js/lint.js?v=20260522"></script>
  <script src="/assets/js/product-switcher.js?v=20260514e"></script>
  <script src="/assets/js/site-chrome.js?v=20260521s17"></script>
</body>
</html>
