log_format structural_phase_privacy
    'request_id=$request_id method=$request_method '
    'status=$status bytes=$body_bytes_sent request_time=$request_time '
    'upstream_time=$upstream_response_time';

server {
    server_name phase.bytedance.city;
    access_log /var/log/nginx/access.log structural_phase_privacy;
    error_log /dev/null crit;
    proxy_hide_header Referrer-Policy;
    add_header Referrer-Policy "no-referrer" always;

    location = /api/backtest-result {
        proxy_pass http://127.0.0.1:3210;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Request-ID $request_id;
    }

    location = /api/backtest-cumulative {
        proxy_pass http://127.0.0.1:3210;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Request-ID $request_id;
    }

    # The API liveness route is /health, while all data routers retain /api/.
    location = /api/health {
        proxy_pass http://127.0.0.1:8200/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Request-ID $request_id;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Request-ID $request_id;
    }

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Request-ID $request_id;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/phase.bytedance.city/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phase.bytedance.city/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name phase.bytedance.city;
    access_log /var/log/nginx/access.log structural_phase_privacy;
    error_log /dev/null crit;
    proxy_hide_header Referrer-Policy;
    add_header Referrer-Policy "no-referrer" always;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://phase.bytedance.city$uri;
    }
}
