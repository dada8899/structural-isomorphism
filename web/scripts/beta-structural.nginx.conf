# Canonical production vhost for beta.structural.bytedance.city.
# Keep this file TLS-complete: deploy-vps.sh installs it transactionally.

log_format structural_beta_privacy
    'request_id=$request_id method=$request_method '
    'status=$status bytes=$body_bytes_sent request_time=$request_time '
    'upstream_time=$upstream_response_time';

server {
    listen 443 ssl;
    server_name beta.structural.bytedance.city;
    access_log /var/log/nginx/access.log structural_beta_privacy;
    error_log /dev/null crit;
    proxy_hide_header Referrer-Policy;
    add_header Referrer-Policy "no-referrer" always;

    ssl_certificate /etc/letsencrypt/live/beta.structural.bytedance.city/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beta.structural.bytedance.city/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # The legacy Phase reports and every current research stream must flush
    # incrementally. Keep both route families explicit when adding a stream.
    location ~ ^/phase/api/(analogy(-detail)?/stream|memo/stream|deep-report)$ {
        proxy_pass http://127.0.0.1:5004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Request-ID $request_id;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ~ ^/api/(analyze|ask|mapping|struct-lint)/stream$ {
        proxy_pass http://127.0.0.1:5004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Request-ID $request_id;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://127.0.0.1:5004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Request-ID $request_id;
        proxy_http_version 1.1;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}

server {
    listen 80;
    server_name beta.structural.bytedance.city;
    access_log /var/log/nginx/access.log structural_beta_privacy;
    error_log /dev/null crit;
    proxy_hide_header Referrer-Policy;
    add_header Referrer-Policy "no-referrer" always;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Do not carry a query string into HTTPS: legacy private query parameters,
    # magic-link tokens, and SSO codes must never be copied into a redirect.
    location / {
        return 301 https://beta.structural.bytedance.city$uri;
    }
}
