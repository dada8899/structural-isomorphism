[pytest]
markers =
    e2e: real-browser end-to-end tests selected explicitly by CI
    post_deploy: tests that only pass after W3-C ships new /index.html (Perplexity-like home)
    slow: end-to-end tests that exercise many surfaces in one run (W14-A journey, ~60-120s)
    requires_internet: tests that audit deployed public surfaces
